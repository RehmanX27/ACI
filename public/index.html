<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>ACI · AI Consumption Intelligence</title>

<style>

/* =========================================================
   CORE THEME
========================================================= */

:root{
  --bg:#050505;
  --surface:#0b0b0b;
  --surface2:#111111;
  --border:#252525;

  --text:#f3f3f3;
  --muted:#6d6d6d;

  --accent:#ffffff;
  --accentSoft:rgba(255,255,255,.08);

  --userBg:#f3f3f3;
  --userText:#050505;

  --ok:#67f5a0;
  --danger:#ef8585;

  --sidebar:292px;
}


/* =========================================================
   LIGHT
========================================================= */

body[data-theme="light"]{

  --bg:#f4f4f1;
  --surface:#ffffff;
  --surface2:#ededeb;
  --border:#d9d9d5;

  --text:#111111;
  --muted:#6d6d6d;

  --accent:#111111;
  --accentSoft:rgba(0,0,0,.06);

  --userBg:#111111;
  --userText:#ffffff;
}


/* =========================================================
   ACCENTS
========================================================= */

body[data-accent="blue"]{
  --accent:#5ea7ff;
  --accentSoft:rgba(94,167,255,.12);
}

body[data-theme="light"][data-accent="blue"]{
  --accent:#1769d2;
}


body[data-accent="violet"]{
  --accent:#a78bfa;
  --accentSoft:rgba(167,139,250,.12);
}

body[data-theme="light"][data-accent="violet"]{
  --accent:#7047c4;
}


body[data-accent="green"]{
  --accent:#55d99a;
  --accentSoft:rgba(85,217,154,.12);
}

body[data-theme="light"][data-accent="green"]{
  --accent:#168653;
}


body[data-accent="orange"]{
  --accent:#ff9d52;
  --accentSoft:rgba(255,157,82,.12);
}

body[data-theme="light"][data-accent="orange"]{
  --accent:#c96513;
}


body[data-accent="pink"]{
  --accent:#f472b6;
  --accentSoft:rgba(244,114,182,.12);
}

body[data-theme="light"][data-accent="pink"]{
  --accent:#c63b7e;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  width:100%;
  height:100%;

  background:var(--bg);
  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  overflow:hidden;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   APP
========================================================= */

.app{

  height:100vh;

  display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

  width:var(--sidebar);

  flex-shrink:0;

  height:100vh;

  background:var(--surface);

  border-right:
    1px solid var(--border);

  padding:
    24px 22px 18px;

  display:flex;

  flex-direction:column;
}


.brand{

  display:flex;

  align-items:center;

  gap:12px;

  margin:
    0 4px 26px;
}


.mark{

  width:35px;
  height:35px;

  border-radius:10px;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #bbb 25%,
      #666 55%,
      #111 100%
    );

  box-shadow:
    0 0 0 1px #333;
}


.brandName{

  font-size:19px;

  font-weight:800;

  line-height:1;
}


.brandSub{

  font-size:8px;

  letter-spacing:2px;

  color:var(--muted);

  margin-top:4px;
}


.newChat{

  height:49px;

  border:0;

  border-radius:12px;

  background:var(--accent);

  color:var(--bg);

  font-weight:750;

  text-align:left;

  padding:
    0 18px;
}


.history{

  margin-top:34px;

  flex:1;

  min-height:0;

  overflow:auto;
}


.historyLabel{

  margin:
    0 9px 13px;

  color:var(--muted);

  font-size:9px;

  font-weight:700;

  letter-spacing:2px;

  text-transform:uppercase;
}


.historyItem{

  display:block;

  width:100%;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:
    9px 10px;

  border-radius:8px;

  text-align:left;

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}


.historyItem:hover{

  background:var(--accentSoft);

  color:var(--text);
}


.empty{

  padding:
    8px 10px;

  color:#444;

  font-size:11px;
}


.status{

  border-top:
    1px solid var(--border);

  padding-top:18px;

  color:var(--muted);

  font-size:10px;
}


.dot{

  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--ok);

  margin-right:7px;
}


/* =========================================================
   MAIN
========================================================= */

.main{

  flex:1;

  min-width:0;

  height:100vh;

  display:flex;

  flex-direction:column;

  background:var(--bg);
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

  height:70px;

  flex-shrink:0;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 26px 0 30px;
}


.topLabel{

  font-size:11px;

  color:var(--muted);
}


/* =========================================================
   APPEARANCE
========================================================= */

.themeWrap{

  position:relative;
}


.themeBtn{

  height:35px;

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color:
    var(--text);

  border-radius:9px;

  padding:
    0 11px;

  font-size:11px;
}


.themeMenu{

  display:none;

  position:absolute;

  z-index:100;

  right:0;

  top:43px;

  width:230px;

  padding:12px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:13px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.25);
}


.themeMenu.open{
  display:block;
}


.menuTitle{

  font-size:9px;

  color:var(--muted);

  letter-spacing:1.5px;

  text-transform:uppercase;

  margin:
    3px 5px 9px;
}


.themeChoices{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  margin-bottom:13px;
}


.themeChoice{

  border:
    1px solid var(--border);

  background:
    var(--surface2);

  color:
    var(--text);

  border-radius:8px;

  padding:
    9px 8px;

  text-align:left;

  font-size:10px;
}


.themeChoice.active,
.themeChoice:hover{

  border-color:
    var(--accent);

  background:
    var(--accentSoft);
}


.accents{

  display:flex;

  gap:8px;

  padding:
    2px 4px 4px;

  flex-wrap:wrap;
}


.accent{

  width:25px;

  height:25px;

  border-radius:50%;

  border:
    2px solid transparent;

  padding:0;
}


.accent.active{

  border-color:
    var(--text);
}


.neutral{background:#999}
.blue{background:#5ea7ff}
.violet{background:#a78bfa}
.green{background:#55d99a}
.orange{background:#ff9d52}
.pink{background:#f472b6}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

  flex:1;

  min-height:0;

  overflow:hidden;
}


.workspaceInner{

  width:
    min(
      1080px,
      calc(100% - 48px)
    );

  height:100%;

  margin:auto;

  display:flex;

  flex-direction:column;
}


/* =========================================================
   SIGNAL
========================================================= */

.signal{

  flex-shrink:0;

  padding:
    40px 0 20px;
}


.kicker{

  font-size:10px;

  font-weight:700;

  letter-spacing:1.6px;

  text-transform:uppercase;

  color:var(--muted);

  margin-bottom:13px;
}


.kicker::before{

  content:"";

  display:inline-block;

  width:6px;
  height:6px;

  border-radius:50%;

  background:var(--accent);

  box-shadow:
    0 0 9px var(--accent);

  margin-right:9px;
}


.signalText{

  max-width:900px;

  margin:0;

  font-size:
    clamp(
      30px,
      3.5vw,
      51px
    );

  line-height:1.02;

  letter-spacing:-2.3px;

  font-weight:850;
}


.signalMeta{

  font-size:10px;

  color:#555;

  margin-top:12px;
}


/* =========================================================
   CHAT SCROLL
========================================================= */

.chatScroll{

  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:
    8px 0 20px;

  scrollbar-width:thin;
}


.messages{

  display:flex;

  flex-direction:column;

  gap:22px;

  padding-right:3px;
}


.message{

  display:flex;

  width:100%;
}


.message.user{

  justify-content:flex-end;
}


.message.ai{

  justify-content:flex-start;
}


.messageInner{

  max-width:
    min(
      800px,
      88%
    );
}


.label{

  font-size:9px;

  letter-spacing:1.3px;

  text-transform:uppercase;

  color:var(--muted);

  margin-bottom:7px;
}


.bubble{

  padding:
    15px 17px;

  border-radius:15px;

  font-size:14px;

  line-height:1.68;

  word-break:break-word;
}


.user .bubble{

  background:
    var(--userBg);

  color:
    var(--userText);

  border-bottom-right-radius:4px;
}


.ai .bubble{

  background:
    var(--surface);

  color:
    var(--text);

  border:
    1px solid var(--border);

  border-bottom-left-radius:4px;
}


/* =========================================================
   MARKDOWN
========================================================= */

.markdown p{

  margin:
    0 0 11px;
}


.markdown p:last-child{

  margin-bottom:0;
}


.markdown strong{

  font-weight:750;
}


.markdown ul{

  margin:
    8px 0;

  padding-left:20px;
}


.markdown li{

  margin:
    4px 0;
}


.markdown code{

  background:
    var(--surface2);

  border:
    1px solid var(--border);

  padding:
    2px 5px;

  border-radius:5px;

  font-family:
    monospace;

  font-size:12px;
}


/* =========================================================
   TYPING
========================================================= */

.typing{

  display:flex;

  gap:4px;
}


.typing span{

  width:4px;

  height:4px;

  border-radius:50%;

  background:var(--muted);

  animation:
    blink 1s infinite;
}


.typing span:nth-child(2){
  animation-delay:.15s;
}


.typing span:nth-child(3){
  animation-delay:.3s;
}


@keyframes blink{

  0%,100%{
    opacity:.2;
  }

  50%{
    opacity:1;
  }
}


/* =========================================================
   TRACE
========================================================= */

.trace{

  display:none;

  margin:
    5px 0 15px;

  border:
    1px solid var(--border);

  background:
    var(--surface);

  border-radius:12px;

  padding:
    12px 14px;
}


.trace.show{
  display:block;
}


.traceGrid{

  display:flex;

  flex-wrap:wrap;

  gap:7px;
}


.pill{

  border:
    1px solid var(--border);

  background:
    var(--surface2);

  padding:
    6px 8px;

  border-radius:7px;

  font-size:10px;

  color:var(--muted);
}


.pill b{

  color:var(--text);
}


/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions{

  flex-shrink:0;

  display:flex;

  gap:8px;

  flex-wrap:wrap;

  padding:
    7px 0 11px;
}


.suggestion{

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color:
    var(--muted);

  border-radius:999px;

  padding:
    8px 12px;

  font-size:10px;
}


.suggestion:hover{

  color:var(--text);

  border-color:
    var(--accent);

  background:
    var(--accentSoft);
}


/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{

  flex-shrink:0;

  padding:
    5px 0 21px;

  background:
    var(--bg);
}


.attachment{

  display:none;

  width:max-content;

  max-width:100%;

  align-items:center;

  gap:8px;

  margin-bottom:8px;

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color:
    var(--text);

  border-radius:9px;

  padding:
    7px 10px;

  font-size:10px;
}


.attachment.show{

  display:flex;
}


.fileName{

  max-width:320px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}


.remove{

  border:0;

  background:transparent;

  color:var(--muted);

  font-size:14px;
}


.composer{

  border:
    1px solid var(--border);

  background:
    var(--surface);

  border-radius:17px;
}


.composer:focus-within{

  border-color:
    var(--accent);
}


textarea{

  display:block;

  width:100%;

  min-height:67px;

  max-height:190px;

  resize:none;

  border:0;

  outline:0;

  background:transparent;

  color:var(--text);

  padding:
    16px 17px 8px;

  font-size:14px;

  line-height:1.5;
}


textarea::placeholder{

  color:var(--muted);
}


.composerBottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    6px 9px 9px 12px;
}


.icon{

  width:34px;

  height:34px;

  border:
    1px solid transparent;

  background:transparent;

  color:var(--muted);

  border-radius:9px;

  font-size:17px;
}


.icon:hover{

  background:
    var(--surface2);

  color:
    var(--text);

  border-color:
    var(--border);
}


.send{

  width:38px;

  height:38px;

  border:0;

  border-radius:11px;

  background:
    var(--accent);

  color:
    var(--bg);

  font-weight:800;

  font-size:17px;
}


.send:disabled{

  opacity:.35;

  cursor:not-allowed;
}


.note{

  text-align:center;

  color:#444;

  font-size:9px;

  margin-top:7px;
}


#fileInput{
  display:none;
}


.error{

  color:
    var(--danger);

  border:
    1px solid rgba(239,133,133,.25);

  background:
    rgba(239,133,133,.05);

  border-radius:10px;

  padding:
    11px 13px;

  font-size:11px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .topbar{

    height:58px;

    padding:
      0 15px;
  }

  .workspaceInner{

    width:
      calc(100% - 28px);
  }

  .signal{

    padding:
      30px 0 18px;
  }

  .signalText{

    font-size:31px;

    letter-spacing:-1.6px;
  }

  .messageInner{

    max-width:94%;
  }

  .suggestions{

    overflow-x:auto;

    flex-wrap:nowrap;

    scrollbar-width:none;
  }

  .suggestion{

    white-space:nowrap;
  }

  .composerWrap{

    padding-bottom:13px;
  }

}

</style>
</head>


<body
  data-theme="dark"
  data-accent="neutral"
>


<div class="app">


  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">

      <div class="mark"></div>

      <div>

    <button

/>



<script>

/* ============================================================
   ELEMENTS
============================================================ */

const $ = id =>
  document.getElementById(id);


const body =
  document.body;

const prompt =
  $("prompt");

const send =
  $("send");

const messages =
  $("messages");

const chatScroll =
  $("chatScroll");

const suggestions =
  $("suggestions");

const attachment =
  $("attachment");

const fileName =
  $("fileName");

const fileInput =
  $("fileInput");

const trace =
  $("trace");

const traceGrid =
  $("traceGrid");

const historyList =
  $("historyList");

const signalText =
  $("signalText");

const signalMeta =
  $("signalMeta");


let selectedFile =
  null;

let isSending =
  false;


/* ============================================================
   THEME
============================================================ */

function applyTheme(){

  const theme =
    localStorage.getItem(
      "aci_theme"
    ) || "dark";


  const accent =
    localStorage.getItem(
      "aci_accent"
    ) || "neutral";


  body.dataset.theme =
    theme;

  body.dataset.accent =
    accent;


  document
    .querySelectorAll(
      "[data-theme]"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.theme === theme
      );

    });


  document
    .querySelectorAll(
      "[data-accent]"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.accent === accent
      );

    });

}


$("themeBtn").addEventListener(
  "click",
  event => {

    event.stopPropagation();

    $("themeMenu")
      .classList
      .toggle("open");

  }
);


document.addEventListener(
  "click",
  event => {

    const menu =
      $("themeMenu");

    const button =
      $("themeBtn");


    if (
      !menu.contains(event.target) &&
      !button.contains(event.target)
    ){

      menu.classList.remove(
        "open"
      );

    }

  }
);

/* ============================================================

function tenWords(text){

  if (!text){

    return "AI is becoming infrastructure, not just software.";

  }


  const words =
    text
      .trim()
      .split(/\s+/)
      .slice(0,10);


  let result =
    words.join(" ");


  if (
    !/[.!?]$/.test(result)
  ){

    result += ".";

  }


  return result;

}


async function loadInsight(){

  try{

    const response =
      await fetch(
        "/api/insight",
        {
          cache:
            "no-store"
        }
      );


    if (!response.ok){

      throw new Error(
        "Insight unavailable"
      );

    }


    const data =
      await response.json();


    signalText.textContent =
      tenWords(
        data.text ||
        data.insight ||
        data.headline
      );


    signalMeta.textContent =
      "Fresh intelligence signal · " +
      new Date()
        .toLocaleTimeString(
          [],
          {
            hour:
              "2-digit",

            minute:
              "2-digit"
          }
        );


  }catch{

    const fallback = [

      "AI is becoming infrastructure, not just software.",

      "Model choice is becoming an economic decision.",

      "AI agents are moving deeper into workflows.",

      "The next AI advantage may come from routing.",

      "Enterprise AI is moving from pilots to production."

    ];


    signalText.textContent =
      tenWords(
        fallback[
          Math.floor(
            Math.random() *
            fallback.length
          )
        ]
      );


    signalMeta.textContent =
      "ACI intelligence signal";

  }

}

/* ============================================================
   FILE PROCESSING
============================================================ */

function readBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            String(
              reader.result || ""
            );


          const comma =
            result.indexOf(",");


          resolve(
            comma >= 0
              ? result.slice(
                  comma + 1
                )
              : result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not process the attachment."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function readText(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            String(
              reader.result || ""
            )
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read the file."
            )
          );

        };


      reader.readAsText(
        file
      );

    }
  );

}


async function prepareFile(file){

  if (!file){

    return null;

  }


  /*
    Conservative browser → Vercel
    JSON payload limit.
  */

  if (
    file.size >
    2.8 * 1024 * 1024
  ){

    throw new Error(
      "For now, attachments must be smaller than 2.8 MB."
    );

  }


  /*
    PDF
  */

  if (
    file.type ===
      "application/pdf" ||

    file.name
      .toLowerCase()
      .endsWith(".pdf")
  ){

    return {

      name:
        file.name,

      mimeType:
        "application/pdf",

      base64:
        await readBase64(
          file
        )

    };

  }


  /*
    IMAGE
  */

  if (
    file.type &&
    file.type.startsWith(
      "image/"
    )
  ){

    return {

      name:
        file.name,

      mimeType:
        file.type,

      base64:
        await readBase64(
          file
        )

    };

  }


  /*
    TEXT / CODE
  */

  return {

    name:
      file.name,

    mimeType:
      file.type ||
      "text/plain",

    extractedText:
      await readText(
        file
      )

  };

}


/* ============================================================
   SAFE MARKDOWN
============================================================ */

function escapeHtml(value){

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function renderMarkdown(text){

  let html =
    escapeHtml(
      text
    );


  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  const lines =
    html.split("\n");


  let output =
    "";

  let inList =
    false;


  for (
    const line of lines
  ){

    if (
      /^\s*[-•]\s+/.test(
        line
      )
    ){

      if (!inList){

        output +=
          "<ul>";

        inList =
          true;

      }


      output +=
        "<li>" +
        line.replace(
          /^\s*[-•]\s+/,
          ""
        ) +
        "</li>";

    }else{

      if (inList){

        output +=
          "</ul>";

        inList =
          false;

      }


      if (line.trim()){

        output +=
          "<p>" +
          line +
          "</p>";

      }

    }

  }


  if (inList){

    output +=
      "</ul>";

  }


  return output;

}

function renderHistory(){

  historyList.innerHTML =
    "";


  let history =
    [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aci_history"
        ) || "[]"
      );

  }catch{

    history =
      [];

  }


  if (!history.length){

    historyList.innerHTML =
      `
        <div class="empty">
          No conversations yet.
        </div>
      `;

    return;

  }


  history.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "historyItem";


      button.textContent =
        item.title;


      button.addEventListener(
        "click",
        () => {

          prompt.value =
            item.title;

          resizePrompt();

          prompt.focus();

        }
      );


      historyList.appendChild(
        button
      );

    }
  );

}


function saveHistory(title){

  const clean =
    title
      .replace(
        /\s+/g,
        " "
      )
      .trim()
      .slice(
        0,
        65
      );


  if (!clean){

    return;

  }


  let history =
    [];


  try{

    history =
      JSON.parse(
        localStorage.getItem(
          "aci_history"
        ) || "[]"
      );

  }catch{

    history =
      [];

  }


  if (
    history[0]?.title ===
    clean
  ){

    return;

  }


  history.unshift({

    title:
      clean,

    time:
      Date.now()

  });


  localStorage.setItem(
    "aci_history",
    JSON.stringify(
      history.slice(
        0,
        20
      )
    )
  );


  renderHistory();

}

/* ============================================================
   SEND TO ACI
============================================================ */

async function sendPrompt(){

  if (isSending){

    return;

  }


  const typed =
    prompt.value.trim();


  const requestPrompt =
    typed ||
    (
      selectedFile
        ? "Analyze the attached file and provide the most useful summary or insights."
        : ""
    );


  if (!requestPrompt){

    prompt.focus();

    return;

  }


  isSending =
    true;

  send.disabled =
    true;


  suggestions.style.display =
    "none";


  let displayPrompt =
    requestPrompt;


  if (selectedFile){

    displayPrompt +=
      "\n\n📎 " +
      selectedFile.name;

  }


  addMessage(
    "user",
    displayPrompt
  );


  prompt.value =
    "";

  resizePrompt();


  let payload =
    null;


  try{

    payload =
      await prepareFile(
        selectedFile
      );

  }catch(error){

    addError(
      error.message
    );

    isSending =
      false;

    send.disabled =
      false;

    return;

  }


  const typing =
    addTyping();


  clearFile();


  trace.classList.remove(
    "show"
  );


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              prompt:
                requestPrompt,

              file:
                payload

            })

        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    let data;


    if (
      contentType.includes(
        "application/json"
      )
    ){

      data =
        await response.json();

    }else{

      await response.text();

      throw new Error(
        "ACI server returned a non-JSON response. Check the Vercel deployment."
      );

    }


    if (!response.ok){

      throw new Error(
        data?.error ||
        "AI request failed."
      );

    }


    typing.remove();


    addMessage(
      "ai",
      data.answer ||
      "ACI returned an empty response."
    );


    renderTrace(
      data.trace
    );


    saveHistory(
      requestPrompt
    );


  }catch(error){

    typing.remove();


    addError(
      error.message ||
      "Something went wrong while contacting ACI."
    );


  }finally{

    isSending =
      false;

    send.disabled =
      false;

    prompt.focus();

  }

}


send.addEventListener(
  "click",
  sendPrompt
);
