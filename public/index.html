<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>ACI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs"
type="module"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.9.0/mammoth.browser.min.js"></script>


<style>

:root {
  --bg: #07080b;
  --panel: #0d0f14;
  --panel2: #11141b;
  --line: #20242d;
  --text: #f4f5f7;
  --muted: #7d8492;
  --muted2: #555c69;
  --accent: #ffffff;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  background:
    radial-gradient(
      circle at 50% -20%,
      #191d27 0,
      #090a0e 38%,
      #07080b 70%
    );

  color: var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}


/* =====================================================
   HEADER
===================================================== */

header {

  height: 68px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 28px;

  border-bottom:
    1px solid rgba(255,255,255,.06);

  background:
    rgba(7,8,11,.72);

  backdrop-filter:
    blur(20px);

}

.logo {

  display: flex;

  align-items: center;

  gap: 10px;

  font-weight: 800;

  letter-spacing: -.03em;

}

.logo-mark {

  width: 27px;

  height: 27px;

  border-radius: 9px;

  background:
    linear-gradient(
      135deg,
      #fff,
      #777
    );

  box-shadow:
    0 0 25px rgba(255,255,255,.12);

}

.header-right {

  color: var(--muted);

  font-size: 12px;

}


/* =====================================================
   MAIN
===================================================== */

main {

  width:
    min(900px, 92%);

  margin:
    0 auto;

  padding:
    90px 0 70px;

}


.hero {

  text-align:
    center;

  margin-bottom:
    42px;

}

.eyebrow {

  color:
    #8e95a3;

  font-size:
    12px;

  letter-spacing:
    .16em;

  text-transform:
    uppercase;

  margin-bottom:
    17px;

}

.hero h1 {

  margin:
    0;

  font-size:
    clamp(38px, 7vw, 72px);

  letter-spacing:
    -.065em;

  line-height:
    .98;

  font-weight:
    750;

}

.hero p {

  max-width:
    620px;

  margin:
    20px auto 0;

  color:
    var(--muted);

  line-height:
    1.65;

  font-size:
    15px;

}


/* =====================================================
   AI WORKSPACE
===================================================== */

.workspace {

  background:
    rgba(13,15,20,.88);

  border:
    1px solid rgba(255,255,255,.08);

  border-radius:
    24px;

  padding:
    14px;

  box-shadow:
    0 30px 100px rgba(0,0,0,.35);

}


textarea {

  width:
    100%;

  min-height:
    170px;

  resize:
    vertical;

  border:
    none;

  outline:
    none;

  background:
    transparent;

  color:
    var(--text);

  font-size:
    17px;

  line-height:
    1.65;

  padding:
    17px;

}

textarea::placeholder {

  color:
    #4f5662;

}


/* =====================================================
   ATTACHMENT
===================================================== */

.attachments {

  display:
    flex;

  flex-wrap:
    wrap;

  gap:
    8px;

  padding:
    0 12px 10px;

}


.file-chip {

  display:
    inline-flex;

  align-items:
    center;

  gap:
    8px;

  background:
    #171a21;

  border:
    1px solid #282d37;

  padding:
    7px 10px;

  border-radius:
    10px;

  font-size:
    12px;

  color:
    #b8bec9;

}


.file-remove {

  cursor:
    pointer;

  color:
    #717987;

}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  padding:
    10px 10px 5px;

}

.tools {

  display:
    flex;

  gap:
    8px;

}

.icon-button {

  width:
    40px;

  height:
    40px;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid #252a33;

  border-radius:
    12px;

  background:
    #11141a;

  color:
    #a5acb8;

  cursor:
    pointer;

  font-size:
    17px;

}

.icon-button:hover {

  border-color:
    #4a505c;

  color:
    white;

}

.send {

  height:
    42px;

  padding:
    0 19px;

  border:
    none;

  border-radius:
    12px;

  background:
    white;

  color:
    black;

  font-weight:
    750;

  cursor:
    pointer;

}

.send:disabled {

  opacity:
    .45;

  cursor:
    default;

}


/* =====================================================
   SUGGESTIONS
===================================================== */

.suggestions {

  display:
    flex;

  flex-wrap:
    wrap;

  justify-content:
    center;

  gap:
    8px;

  margin-top:
    18px;

}

.suggestion {

  background:
    transparent;

  border:
    1px solid #252a33;

  color:
    #7f8794;

  border-radius:
    20px;

  padding:
    8px 13px;

  cursor:
    pointer;

  font-size:
    12px;

}

.suggestion:hover {

  color:
    white;

  border-color:
    #555c68;

}


/* =====================================================
   DROP ZONE
===================================================== */

.drop-zone {

  position:
    fixed;

  inset:
    0;

  display:
    none;

  place-items:
    center;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(8px);

  z-index:
    100;

}

.drop-zone.active {

  display:
    grid;

}

.drop-inner {

  width:
    min(500px, 85%);

  border:
    1px dashed #707784;

  border-radius:
    22px;

  padding:
    60px 30px;

  text-align:
    center;

  background:
    #10131a;

}

.drop-inner h2 {

  margin:
    0 0 10px;

}

.drop-inner p {

  color:
    var(--muted);

  font-size:
    13px;

}


/* =====================================================
   STATUS
===================================================== */

.status {

  text-align:
    center;

  color:
    #626a77;

  font-size:
    11px;

  min-height:
    20px;

  margin-top:
    20px;

}

.pulse {

  display:
    inline-block;

  width:
    6px;

  height:
    6px;

  border-radius:
    50%;

  background:
    #aaa;

  margin-right:
    7px;

  animation:
    pulse 1.1s infinite;

}

@keyframes pulse {

  0%,100% {
    opacity: .25;
  }

  50% {
    opacity: 1;
  }

}


/* =====================================================
   RESPONSE
===================================================== */

.response {

  margin-top:
    30px;

  background:
    rgba(13,15,20,.92);

  border:
    1px solid #20242d;

  border-radius:
    20px;

  padding:
    28px;

  line-height:
    1.75;

  white-space:
    pre-wrap;

  color:
    #e5e7eb;

  display:
    none;

}

.trace {

  margin-top:
    17px;

  color:
    #555d6b;

  font-size:
    10px;

  text-align:
    center;

}


/* =====================================================
   FOOTER
===================================================== */

footer {

  text-align:
    center;

  color:
    #454b56;

  font-size:
    10px;

  margin-top:
    50px;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px) {

  main {

    padding-top:
      55px;

  }

  header {

    padding:
      0 16px;

  }

  .header-right {

    display:
      none;

  }

  .workspace {

    border-radius:
      18px;

  }

  textarea {

    min-height:
      200px;

    font-size:
      16px;

  }

}

</style>

</head>


<body>


<header>

  <div class="logo">

    <div class="logo-mark"></div>

    <span>ACI</span>

  </div>

  <div class="header-right">
    AI Consumption Intelligence
  </div>

</header>


<main>


<section class="hero">

  <div class="eyebrow">
    Enterprise AI Workspace
  </div>

  <h1>
    What should we<br>
    work on?
  </h1>

  <p id="heroText">
    Ask for an outcome. ACI handles the intelligence behind it.
  </p>

</section>


<section class="workspace">


<textarea
  id="prompt"
  autofocus
  placeholder="Ask anything..."
></textarea>


<div
  id="attachments"
  class="attachments"
></div>


<div class="toolbar">

  <div class="tools">

    <button
      class="icon-button"
      onclick="document.getElementById('fileInput').click()"
      title="Attach document"
    >
      +
    </button>

    <input
      id="fileInput"
      type="file"
      hidden
      multiple
      accept=".txt,.md,.csv,.json,.html,.xml,.pdf,.docx"
      onchange="handleFiles(this.files)"
    >

  </div>


  <button
    id="send"
    class="send"
    onclick="sendPrompt()"
  >
    Generate
  </button>

</div>

</section>


<div
  id="suggestions"
  class="suggestions"
></div>


<div
  id="status"
  class="status"
></div>


<div
  id="response"
  class="response"
></div>


<div
  id="trace"
  class="trace"
></div>


<footer>
  ACI · Secure enterprise AI workspace
</footer>

</main>


<div
  id="dropZone"
  class="drop-zone"
>

  <div class="drop-inner">

    <h2>
      Drop your document
    </h2>

    <p>
      PDF, DOCX, TXT, Markdown, CSV or JSON
    </p>

  </div>

</div>


<script type="module">

/* =====================================================
   PDF.JS
===================================================== */

import * as pdfjsLib
from
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


/* =====================================================
   STATE
===================================================== */

let attachedDocuments = [];


/* =====================================================
   DYNAMIC PROMPTS
===================================================== */

const promptSets = [

  [
    "Turn this idea into an execution plan",
    "Analyze this business opportunity",
    "Draft a professional response",
    "Explain this technical problem simply"
  ],

  [
    "Review this document and find the risks",
    "Create a decision memo",
    "Summarize this for leadership",
    "Build a practical implementation plan"
  ],

  [
    "Compare the available options",
    "Find the key insights in this data",
    "Turn this into a presentation outline",
    "Improve this strategy"
  ]

];


let setIndex =
  Math.floor(
    Math.random() *
    promptSets.length
  );


function renderSuggestions() {

  const container =
    document.getElementById(
      "suggestions"
    );


  const prompts =
    promptSets[setIndex];


  container.innerHTML =
    prompts.map(
      text =>
        `<button
          class="suggestion"
          onclick="usePrompt(${JSON.stringify(text)})"
        >
          ${text}
        </button>`
    ).join("");

}


renderSuggestions();


/* =====================================================
   RANDOM HERO TEXT
===================================================== */

const heroTexts = [

  "Ask for an outcome. ACI handles the intelligence behind it.",

  "Give ACI the problem. Keep your focus on the result.",

  "One workspace. Different tasks. Intelligent AI underneath.",

  "From a question to an outcome, without choosing the model.",

  "Work with AI. Let ACI handle the complexity."

];


document.getElementById(
  "heroText"
).textContent =
  heroTexts[
    Math.floor(
      Math.random() *
      heroTexts.length
    )
  ];


/* =====================================================
   GLOBAL FUNCTIONS
===================================================== */

window.usePrompt =
function(text) {

  document.getElementById(
    "prompt"
  ).value = text;

  document.getElementById(
    "prompt"
  ).focus();

};


/* =====================================================
   FILE HANDLING
===================================================== */

window.handleFiles =
async function(files) {

  for (
    const file of Array.from(files)
  ) {

    try {

      const content =
        await extractFileText(file);


      attachedDocuments.push({

        name:
          file.name,

        size:
          file.size,

        content

      });


    } catch (error) {

      alert(
        `Could not read ${file.name}: ${error.message}`
      );

    }

  }


  renderAttachments();

};


/* =====================================================
   DOCUMENT EXTRACTION
===================================================== */

async function extractFileText(file) {

  const name =
    file.name.toLowerCase();


  /*
   * Plain text formats
   */

  if (
    name.endsWith(".txt") ||
    name.endsWith(".md") ||
    name.endsWith(".csv") ||
    name.endsWith(".json") ||
    name.endsWith(".html") ||
    name.endsWith(".xml")
  ) {

    return await file.text();

  }


  /*
   * PDF
   */

  if (
    name.endsWith(".pdf")
  ) {

    const buffer =
      await file.arrayBuffer();


    const pdf =
      await pdfjsLib.getDocument({
        data: buffer
      }).promise;


    let text = "";


    for (
      let i = 1;
      i <= pdf.numPages;
      i++
    ) {

      const page =
        await pdf.getPage(i);


      const content =
        await page.getTextContent();


      text +=
        content.items
          .map(
            item => item.str
          )
          .join(" ") +
        "\n";

    }


    return text;

  }


  /*
   * DOCX
   */

  if (
    name.endsWith(".docx")
  ) {

    if (
      !window.mammoth
    ) {

      throw new Error(
        "DOCX reader is still loading. Try again."
      );

    }


    const buffer =
      await file.arrayBuffer();


    const result =
      await window.mammoth.extractRawText({
        arrayBuffer: buffer
      });


    return result.value;

  }


  throw new Error(
    "Unsupported document type."
  );

}


/* =====================================================
   ATTACHMENT UI
===================================================== */

function renderAttachments() {

  const container =
    document.getElementById(
      "attachments"
    );


  container.innerHTML =
    attachedDocuments.map(
      (doc, index) => `

        <div class="file-chip">

          <span>📄</span>

          <span>
            ${escapeHtml(doc.name)}
          </span>

          <span
            class="file-remove"
            onclick="removeDocument(${index})"
          >
            ×
          </span>

        </div>

      `
    ).join("");

}


window.removeDocument =
function(index) {

  attachedDocuments.splice(
    index,
    1
  );

  renderAttachments();

};


/* =====================================================
   SEND
===================================================== */

window.sendPrompt =
async function() {

  const prompt =
    document.getElementById(
      "prompt"
    ).value.trim();


  const send =
    document.getElementById(
      "send"
    );

  const status =
    document.getElementById(
      "status"
    );

  const responseBox =
    document.getElementById(
      "response"
    );

  const trace =
    document.getElementById(
      "trace"
    );


  if (
    !prompt &&
    !attachedDocuments.length
  ) {

    return;

  }


  let finalPrompt =
    prompt;


  /*
   * Add extracted documents.
   */

  if (
    attachedDocuments.length
  ) {

    finalPrompt +=
      "\n\n--- ATTACHED DOCUMENTS ---\n";


    for (
      const doc of attachedDocuments
    ) {

      finalPrompt +=
        `\n\nFILE: ${doc.name}\n\n` +
        doc.content +
        "\n\n--- END FILE ---\n";

    }

  }


  send.disabled =
    true;

  send.textContent =
    "Working…";


  responseBox.style.display =
    "none";


  trace.style.display =
    "none";


  status.innerHTML =
    `<span class="pulse"></span>ACI is thinking`;


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({
              prompt:
                finalPrompt
            })

        }
      );


    const data =
      await response.json();


    if (
      !response.ok
    ) {

      throw new Error(
        data?.error ||
        "Request failed."
      );

    }


    responseBox.textContent =
      data.answer || "";


    responseBox.style.display =
      "block";


    if (
      data.trace
    ) {

      trace.textContent =
        `ACI · ${data.trace.taskType} · complexity ${data.trace.complexity}/5 · ${data.trace.latencyMs}ms · ${data.trace.totalTokens} tokens · ${data.trace.outcome}`;

      trace.style.display =
        "block";

    }


    status.textContent =
      "Ready";


  } catch (error) {

    status.textContent =
      "Something went wrong";

    responseBox.textContent =
      error?.message ||
      "Request failed.";

    responseBox.style.display =
      "block";

  }


  send.disabled =
    false;

  send.textContent =
    "Generate";

};


/* =====================================================
   DRAG & DROP
===================================================== */

const dropZone =
  document.getElementById(
    "dropZone"
  );


let dragCounter = 0;


document.addEventListener(
  "dragenter",
  event => {

    event.preventDefault();

    dragCounter++;

    dropZone.classList.add(
      "active"
    );

  }
);


document.addEventListener(
  "dragleave",
  event => {

    event.preventDefault();

    dragCounter--;

    if (
      dragCounter <= 0
    ) {

      dropZone.classList.remove(
        "active"
      );

    }

  }
);


document.addEventListener(
  "dragover",
  event => {

    event.preventDefault();

  }
);


document.addEventListener(
  "drop",
  event => {

    event.preventDefault();

    dragCounter = 0;

    dropZone.classList.remove(
      "active"
    );

    if (
      event.dataTransfer?.files
    ) {

      handleFiles(
        event.dataTransfer.files
      );

    }

  }
);


/* =====================================================
   HELPERS
===================================================== */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}

</script>


</body>

</html>
