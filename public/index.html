<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<meta
  name="theme-color"
  content="#050505"
>

<title>ACI · AI Consumption Intelligence</title>

<style>

/* =========================================================
   ACI EMPLOYEE WORKSPACE
   ========================================================= */

:root {

  --bg: #050505;
  --bg2: #080808;

  --panel: #0c0c0e;
  --panel2: #101012;
  --panel3: #141416;

  --border: #25252a;
  --border2: #34343a;

  --text: #f5f5f5;
  --text2: #c7c7cc;
  --muted: #77777f;
  --muted2: #55555c;

  --green: #72efad;
  --red: #ff7078;

  --radius: 18px;

}


* {
  box-sizing: border-box;
}


html {
  scroll-behavior: smooth;
}


body {

  margin: 0;

  min-height: 100vh;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(255,255,255,.045),
      transparent 32%
    ),
    var(--bg);

  color: var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  overflow-x: hidden;

}


button,
textarea,
input {

  font: inherit;

}


/* =========================================================
   APP
   ========================================================= */

.app {

  min-height: 100vh;

}


/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {

  position: fixed;

  inset:
    0 auto 0 0;

  width: 255px;

  padding: 18px;

  border-right:
    1px solid rgba(255,255,255,.06);

  background:
    rgba(7,7,8,.94);

  backdrop-filter:
    blur(22px);

  z-index: 100;

  display: flex;

  flex-direction: column;

  transition:
    transform .25s ease;

}


.brand {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 20px;

}


.logo {

  width: 31px;

  height: 31px;

  border-radius: 10px;

  background:
    radial-gradient(
      circle at 30% 25%,
      #ffffff,
      #bdbdc1 28%,
      #56565b 60%,
      #161619 100%
    );

  box-shadow:
    0 0 30px rgba(255,255,255,.08);

}


.brand-name {

  font-size: 17px;

  font-weight: 850;

  letter-spacing: -.05em;

}


.brand-caption {

  margin-top: 1px;

  color: var(--muted2);

  font-size: 8px;

  letter-spacing: .16em;

  text-transform: uppercase;

}


.new-chat {

  width: 100%;

  padding: 11px 13px;

  border:
    1px solid var(--border2);

  border-radius: 11px;

  background: #f4f4f4;

  color: #050505;

  cursor: pointer;

  font-weight: 800;

  text-align: left;

  transition: .18s;

}


.new-chat:hover {

  background: white;

  transform: translateY(-1px);

}


.side-label {

  margin:
    25px 8px 8px;

  color: var(--muted2);

  font-size: 9px;

  font-weight: 750;

  letter-spacing: .16em;

  text-transform: uppercase;

}


.chat-list {

  display: flex;

  flex-direction: column;

  gap: 3px;

  overflow-y: auto;

}


.chat-item {

  width: 100%;

  padding: 9px 10px;

  border:
    1px solid transparent;

  border-radius: 10px;

  background: transparent;

  color: #99999f;

  text-align: left;

  cursor: pointer;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;

  font-size: 11px;

  transition: .16s;

}


.chat-item:hover {

  background: #111113;

  color: white;

}


.chat-item.active {

  background: #151518;

  border-color: #29292e;

  color: white;

}


.sidebar-bottom {

  margin-top: auto;

  padding-top: 15px;

  border-top:
    1px solid var(--border);

}


.system-status {

  display: flex;

  align-items: center;

  gap: 7px;

  color: #64646c;

  font-size: 9px;

}


.status-dot {

  width: 6px;

  height: 6px;

  border-radius: 50%;

  background: var(--green);

  box-shadow:
    0 0 10px rgba(114,239,173,.5);

}


/* =========================================================
   MAIN
   ========================================================= */

.main {

  min-height: 100vh;

  margin-left: 255px;

}


/* =========================================================
   TOPBAR
   ========================================================= */

.topbar {

  position: sticky;

  top: 0;

  z-index: 50;

  height: 62px;

  padding: 0 28px;

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-bottom:
    1px solid rgba(255,255,255,.045);

  background:
    rgba(5,5,5,.76);

  backdrop-filter:
    blur(20px);

}


.top-left {

  display: flex;

  align-items: center;

  gap: 10px;

  color: #686870;

  font-size: 10px;

}


.mobile-menu {

  display: none;

  width: 33px;

  height: 33px;

  border:
    1px solid var(--border);

  border-radius: 9px;

  background: #101012;

  color: white;

  cursor: pointer;

}


.top-right {

  display: flex;

  gap: 7px;

}


.top-button {

  border:
    1px solid var(--border);

  border-radius: 9px;

  background: #0c0c0e;

  color: #929299;

  padding: 8px 11px;

  font-size: 10px;

  cursor: pointer;

}


.top-button:hover {

  color: white;

  border-color: var(--border2);

}


/* =========================================================
   WORKSPACE
   ========================================================= */

.workspace {

  width:
    min(1040px, 91%);

  margin:
    0 auto;

  padding:
    62px 0 100px;

}


/* =========================================================
   DYNAMIC SIGNAL
   ========================================================= */

.signal {

  text-align: center;

  min-height: 315px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

}


.signal-category {

  display: inline-flex;

  align-items: center;

  gap: 7px;

  margin-bottom: 23px;

  color: #67676f;

  font-size: 9px;

  text-transform: uppercase;

  letter-spacing: .18em;

}


.signal-dot {

  width: 5px;

  height: 5px;

  border-radius: 50%;

  background: #8d8d95;

}


.signal-title {

  max-width: 900px;

  margin: 0;

  font-size:
    clamp(48px, 7vw, 94px);

  line-height: .91;

  letter-spacing: -.075em;

  font-weight: 850;

}


.signal-title .line {

  display: block;

}


.signal-title .faded {

  color: #68686f;

}


.signal-source {

  margin-top: 23px;

  max-width: 650px;

  color: #66666e;

  font-size: 10px;

  line-height: 1.5;

}


.signal-source a {

  color: #8c8c94;

  text-decoration: none;

}


.signal-source a:hover {

  color: white;

  text-decoration: underline;

}


/* signal animation */

.signal-changing {

  animation:
    signalIn .5s ease;

}


@keyframes signalIn {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* =========================================================
   ORB
   ========================================================= */

.orb {

  width: 42px;

  height: 42px;

  margin:
    5px 0 32px;

  border-radius: 50%;

  background:
    radial-gradient(
      circle at 30% 25%,
      white,
      #c9c9cd 22%,
      #67676d 52%,
      #141417 100%
    );

  box-shadow:
    0 0 35px rgba(255,255,255,.12);

  animation:
    pulse 4s ease-in-out infinite;

}


@keyframes pulse {

  0%,
  100% {

    transform: scale(.92);

    opacity: .82;

  }

  50% {

    transform: scale(1.08);

    opacity: 1;

  }

}


/* =========================================================
   CONVERSATION
   ========================================================= */

.conversation {

  width:
    min(820px, 100%);

  margin:
    0 auto 30px;

  display:
    flex;

  flex-direction:
    column;

  gap: 28px;

}


.message {

  max-width: 86%;

  animation:
    messageIn .28s ease;

}


@keyframes messageIn {

  from {

    opacity: 0;

    transform:
      translateY(8px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


.message.user {

  margin-left: auto;

}


.message.ai {

  margin-right: auto;

}


.message-label {

  margin-bottom: 7px;

  color: #5e5e66;

  font-size: 8px;

  font-weight: 750;

  text-transform: uppercase;

  letter-spacing: .16em;

}


.message-body {

  color: #d8d8dc;

  font-size: 14px;

  line-height: 1.75;

  white-space: pre-wrap;

  word-break: break-word;

}


.message.user .message-body {

  padding:
    12px 15px;

  border:
    1px solid #29292e;

  border-radius:
    16px 16px 4px 16px;

  background:
    #141417;

  color: #e7e7ea;

}


.message.ai .message-body {

  padding:
    0;

}


.message-meta {

  margin-top: 7px;

  color: #4f4f56;

  font-size: 8px;

}


/* =========================================================
   TYPING
   ========================================================= */

.typing {

  display: flex;

  gap: 5px;

  padding: 8px 0;

}


.typing span {

  width: 5px;

  height: 5px;

  border-radius: 50%;

  background: #77777e;

  animation:
    typing 1s infinite;

}


.typing span:nth-child(2) {

  animation-delay: .15s;

}


.typing span:nth-child(3) {

  animation-delay: .30s;

}


@keyframes typing {

  0%,
  60%,
  100% {

    opacity: .25;

    transform:
      translateY(0);

  }

  30% {

    opacity: 1;

    transform:
      translateY(-3px);

  }

}


/* =========================================================
   COMPOSER
   ========================================================= */

.composer {

  width:
    min(820px, 100%);

  margin:
    0 auto;

}


.composer-box {

  border:
    1px solid #29292f;

  border-radius: 21px;

  background:
    linear-gradient(
      145deg,
      #101012,
      #0a0a0c
    );

  transition: .2s;

}


.composer-box:focus-within {

  border-color: #424249;

  box-shadow:
    0 20px 80px rgba(0,0,0,.35);

}


.prompt {

  width: 100%;

  min-height: 135px;

  max-height: 400px;

  resize: vertical;

  padding:
    21px 23px 10px;

  border: 0;

  outline: 0;

  background: transparent;

  color: white;

  font-size: 14px;

  line-height: 1.6;

}


.prompt::placeholder {

  color: #55555d;

}


.composer-bottom {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  padding:
    9px 11px 11px 13px;

}


.tools {

  display: flex;

  align-items: center;

  gap: 8px;

  min-width: 0;

}


.attach {

  width: 35px;

  height: 35px;

  display: flex;

  align-items: center;

  justify-content: center;

  border:
    1px solid #29292f;

  border-radius: 10px;

  background: #111114;

  color: #9a9aa1;

  cursor: pointer;

}


.attach:hover {

  color: white;

  border-color: #44444b;

}


.file-chip {

  display: none;

  align-items: center;

  gap: 6px;

  max-width: 260px;

  padding:
    7px 9px;

  border:
    1px solid #29292f;

  border-radius: 8px;

  background: #111114;

  color: #9c9ca3;

  font-size: 9px;

}


.file-chip.visible {

  display: flex;

}


.file-chip-name {

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;

}


.file-remove {

  border: 0;

  background: transparent;

  color: #6e6e75;

  cursor: pointer;

  padding: 0;

}


.file-remove:hover {

  color: white;

}


.generate {

  border: 0;

  border-radius: 11px;

  padding:
    11px 17px;

  background: #f2f2f2;

  color: #050505;

  font-weight: 800;

  font-size: 11px;

  cursor: pointer;

  transition: .18s;

}


.generate:hover {

  background: white;

  transform: translateY(-1px);

}


.generate:disabled {

  opacity: .5;

  cursor: wait;

  transform: none;

}


/* =========================================================
   SUGGESTIONS
   ========================================================= */

.suggestions {

  width:
    min(900px, 100%);

  margin:
    14px auto 0;

  display: flex;

  gap: 7px;

  overflow-x: auto;

  padding-bottom: 5px;

  scrollbar-width: none;

}


.suggestions::-webkit-scrollbar {

  display: none;

}


.suggestion {

  flex:
    0 0 auto;

  padding:
    9px 12px;

  border:
    1px solid #29292f;

  border-radius: 999px;

  background: #0b0b0d;

  color: #77777f;

  cursor: pointer;

  font-size: 9px;

  transition: .18s;

}


.suggestion:hover {

  color: white;

  background: #141417;

  border-color: #45454c;

}


/* =========================================================
   FOOTER INFO
   ========================================================= */

.info {

  text-align: center;

  margin-top: 17px;

  color: #414149;

  font-size: 8px;

}


.info span {

  margin:
    0 5px;

}


.info span + span::before {

  content: "·";

  margin-right: 10px;

}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width: 850px) {

  .sidebar {

    transform:
      translateX(-100%);

  }


  .sidebar.open {

    transform:
      translateX(0);

  }


  .main {

    margin-left: 0;

  }


  .mobile-menu {

    display: flex;

    align-items: center;

    justify-content: center;

  }


  .top-left {

    gap: 8px;

  }


  .workspace {

    width: 92%;

    padding-top: 40px;

  }


  .signal {

    min-height: 285px;

  }


  .signal-title {

    font-size:
      clamp(45px, 13vw, 75px);

  }

}


@media(max-width: 520px) {

  .topbar {

    padding: 0 14px;

  }


  .top-right .top-button {

    display: none;

  }


  .workspace {

    width: 94%;

  }


  .signal-title {

    font-size:
      clamp(43px, 14vw, 65px);

  }


  .signal-source {

    padding:
      0 15px;

  }


  .message {

    max-width: 94%;

  }


  .prompt {

    min-height: 120px;

    padding:
      18px;

  }


  .composer-bottom {

    align-items:
      flex-end;

  }


  .file-chip {

    max-width: 150px;

  }

}

</style>

</head>

</div>


</div>

</div>


<div

<div class="info">

</div>


</section>


</div>


</main>

/* =========================================================
   RANDOM HELPERS
========================================================= */

function randomItem(
  array
) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


function randomThought() {

  const last =
    localStorage.getItem(
      "aci_last_thought"
    );


  let available =
    fallbackThoughts.filter(
      thought =>
        thought.title !== last
    );


  if (!available.length) {

    available =
      fallbackThoughts;

  }


  const selected =
    randomItem(
      available
    );


  localStorage.setItem(
    "aci_last_thought",
    selected.title
  );


  return selected;

}


/* =========================================================
   DYNAMIC INTERNET SIGNAL
========================================================= */

async function loadDynamicThought() {

  signalElement.classList.remove(
    "signal-changing"
  );


  signalTitle.textContent =
    "Finding a fresh AI signal...";


  signalCategoryText.textContent =
    "AI / Technology";


  signalSource.textContent =
    "Looking for something worth thinking about.";


  try {

    const response =
      await fetch(
        `/api/insight?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Insight service unavailable"
      );

    }


    const data =
      await response.json();


    if (
      !data ||
      !data.title
    ) {

      throw new Error(
        "Invalid insight"
      );

    }


    signalTitle.textContent =
      data.title;


    signalCategoryText.textContent =
      data.category ||
      "AI / Technology";


    if (
      data.sourceUrl &&
      data.sourceName
    ) {

      signalSource.innerHTML =
        `
          <a
            href="${escapeAttribute(data.sourceUrl)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHTML(data.sourceName)}
          </a>
          · fresh technology signal
        `;

    } else {

      signalSource.textContent =
        "Fresh ACI thought";

    }


  } catch (error) {

    console.warn(
      "Dynamic insight failed:",
      error
    );


    const fallback =
      randomThought();


    signalTitle.textContent =
      fallback.title;


    signalCategoryText.textContent =
      fallback.category;


    signalSource.textContent =
      "ACI thought · generated for this session";

  }


  signalElement.classList.add(
    "signal-changing"
  );

}


/* =========================================================
   SAFE HTML HELPERS
========================================================= */

function escapeHTML(
  value
) {

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHTML(
    value
  );

}

) {

    .sort(
      () =>
        Math.random() -
        .5
    );

}

/* =========================================================
   CHAT STORAGE
========================================================= */

function saveConversations() {

  try {

    localStorage.setItem(
      "aci_conversations",
      JSON.stringify(
        conversations
      )
    );

  } catch (error) {

    console.warn(
      "Conversation storage unavailable:",
      error
    );

  }

}


function loadConversations() {

  try {

    const stored =
      localStorage.getItem(
        "aci_conversations"
      );


    if (!stored) {

      return;

    }


    const parsed =
      JSON.parse(
        stored
      );


    if (
      Array.isArray(parsed)
    ) {

      conversations =
        parsed.slice(
          0,
          30
        );

    }

  } catch (error) {

    console.warn(
      "Could not load conversations:",
      error
    );

  }

}


/* =========================================================
   CREATE CHAT
========================================================= */

function createChat() {

  const chat = {

    id:
      Date.now().toString(),

    title:
      "New conversation",

    messages:
      [],

    createdAt:
      new Date().toISOString()

  };


  conversations.unshift(
    chat
  );


  currentChatId =
    chat.id;


  attachedFile =
    null;


  attachedText =
    "";


  clearAttachment();


  promptInput.value =
    "";


  renderSidebar();

  renderConversation();

  renderSuggestions();

  loadDynamicThought();


  promptInput.focus();


  closeSidebar();

  saveConversations();

}


function getCurrentChat() {

  return conversations.find(
    chat =>
      chat.id ===
      currentChatId
  );

}


/* =========================================================
   SIDEBAR
========================================================= */

function renderSidebar() {

  const today =
    document.getElementById(
      "todayChats"
    );


  const earlier =
    document.getElementById(
      "earlierChats"
    );


  today.innerHTML =
    "";


  earlier.innerHTML =
    "";


  conversations.forEach(
    (
      chat,
      index
    ) => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "chat-item" +
        (
          chat.id ===
          currentChatId
            ? " active"
            : ""
        );


      button.textContent =
        chat.title ||
        "New conversation";


      button.addEventListener(
        "click",
        () => {

          currentChatId =
            chat.id;


          renderSidebar();

          renderConversation();

          closeSidebar();

        }
      );


      if (
        index < 6
      ) {

        today.appendChild(
          button
        );

      } else {

        earlier.appendChild(
          button
        );

      }

    }
  );

}


/* =========================================================
   CONVERSATION
========================================================= */

function renderConversation() {

  conversationElement.innerHTML =
    "";


  const chat =
    getCurrentChat();


  if (
    !chat ||
    !chat.messages.length
  ) {

    return;

  }


  /*
   * Once a conversation exists,
   * hide the large landing signal.
   */

  signalElement.style.display =
    "none";


  chat.messages.forEach(
    message => {

      addMessageToDOM(
        message.role,
        message.content,
        message.meta
      );

    }
  );


  scrollBottom();

}


function addMessageToDOM(
  role,
  content,
  meta = ""
) {

  const message =
    document.createElement(
      "div"
    );


  message.className =
    `message ${role}`;


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "message-label";


  label.textContent =
    role === "user"
      ? "You"
      : "ACI";


  const body =
    document.createElement(
      "div"
    );


  body.className =
    "message-body";


  body.textContent =
    content;


  message.appendChild(
    label
  );


  message.appendChild(
    body
  );


  if (meta) {

    const metadata =
      document.createElement(
        "div"
      );


    metadata.className =
      "message-meta";


    metadata.textContent =
      meta;


    message.appendChild(
      metadata
    );

  }


  conversationElement.appendChild(
    message
  );

}


function addTyping() {

  const message =
    document.createElement(
      "div"
    );


  message.id =
    "typingMessage";


  message.className =
    "message ai";


  message.innerHTML = `

    <div class="message-label">
      ACI
    </div>

    <div class="typing">

      <span></span>
      <span></span>
      <span></span>

    </div>

  `;


  conversationElement.appendChild(
    message
  );


  scrollBottom();

}


function removeTyping() {

  const element =
    document.getElementById(
      "typingMessage"
    );


  if (element) {

    element.remove();

  }

}


/* =========================================================
   SEND REQUEST
========================================================= */

async function sendPrompt() {

  const typedPrompt =
    promptInput.value.trim();


  if (
    !typedPrompt &&
    !attachedFile
  ) {

    promptInput.focus();

    return;

  }


  if (!currentChatId) {

    createChat();

  }


  const chat =
    getCurrentChat();


  if (!chat) {

    return;

  }


  let requestPrompt =
    typedPrompt ||
    "Analyze the attached document.";


  /*
   * Text-readable attachments
   */

  if (
    attachedFile &&
    attachedText
  ) {

    requestPrompt +=

      `\n\n[ATTACHED DOCUMENT]
Filename: ${attachedFile.name}

${attachedText}

[END ATTACHED DOCUMENT]`;

  }


  /*
   * PDF/DOC/DOCX currently cannot be
   * extracted by the browser.
   *
   * Keep the attachment information visible
   * instead of pretending the content was read.
   */

  else if (
    attachedFile
  ) {

    requestPrompt +=

      `\n\n[ATTACHED FILE]
Filename: ${attachedFile.name}
Type: ${attachedFile.type || "unknown"}
Size: ${attachedFile.size} bytes

[END ATTACHED FILE]`;

  }


  /*
   * Conversation title
   */

  if (
    chat.messages.length === 0
  ) {

    chat.title =
      createTitle(
        typedPrompt ||
        attachedFile?.name ||
        "Document analysis"
      );

  }


  /*
   * User-facing message
   */

  const displayMessage =
    attachedFile

      ? `${typedPrompt || "Analyze this document."}\n\n📎 ${attachedFile.name}`

      : typedPrompt;


  chat.messages.push({

    role:
      "user",

    content:
      displayMessage,

    meta:
      attachedFile
        ? `Attachment · ${attachedFile.name}`
        : ""

  });


  promptInput.value =
    "";


  /*
   * Preserve attachment on failure.
   * Clear only after successful generation.
   */

  renderSidebar();

  renderConversation();

  addTyping();


  generateButton.disabled =
    true;


  generateButton.textContent =
    "Thinking...";


  const started =
    Date.now();


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              prompt:
                requestPrompt

            })

        }
      );


    let data;


    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "The AI service returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(
        data?.error ||
        "AI request failed."
      );

    }


    const answer =
      data?.answer ||
      "ACI returned an empty response.";


    const elapsed =
      Date.now() -
      started;


    removeTyping();


    chat.messages.push({

      role:
        "ai",

      content:
        answer,

      meta:
        `Completed · ${formatLatency(elapsed)}`

    });


    clearAttachment();


    attachedFile =
      null;


    attachedText =
      "";


    renderConversation();

    renderSidebar();

    renderSuggestions();


    saveConversations();


  } catch (error) {

    removeTyping();


    chat.messages.push({

      role:
        "ai",

      content:
        `I couldn't complete that request.\n\n${error?.message || "Please try again."}`,

      meta:
        "Request failed"

    });


    renderConversation();


    saveConversations();

  } finally {

    generateButton.disabled =
      false;


    generateButton.textContent =
      "Generate ↗";


    scrollBottom();

  }

}


/* =========================================================
   TITLE
========================================================= */

function createTitle(
  text
) {

  const cleaned =
    String(
      text
    )
      .replace(
        /\s+/g,
        " "
      )
      .trim();


  if (
    cleaned.length <= 42
  ) {

    return cleaned;

  }


  return (
    cleaned.slice(
      0,
      42
    ) +
    "…"
  );

}


/* =========================================================
   LATENCY
========================================================= */

function formatLatency(
  ms
) {

  if (
    ms < 1000
  ) {

    return `${ms}ms`;

  }


  return `${(
    ms / 1000
  ).toFixed(1)}s`;

}


/* =========================================================
   ATTACHMENTS
========================================================= */

document
  .getElementById(
    "attach"
  )
  .addEventListener(
    "click",
    () => {

      fileInput.value =
        "";

      fileInput.click();

    }
  );


fileInput.addEventListener(
  "change",
  async event => {

    const file =
      event.target.files?.[0];


    if (!file) {

      return;

    }


    const MAX_SIZE =
      5 * 1024 * 1024;


    if (
      file.size >
      MAX_SIZE
    ) {

      alert(
        "Please select a file smaller than 5 MB."
      );

      clearAttachment();

      return;

    }


    attachedFile =
      file;


    attachedText =
      "";


    fileChipName.textContent =
      file.name;


    fileChip.classList.add(
      "visible"
    );


    const extension =
      file.name
        .split(".")
        .pop()
        ?.toLowerCase();


    const readable =
      [

        "txt",
        "md",
        "csv",
        "json",
        "html",
        "htm",
        "js",
        "jsx",
        "ts",
        "tsx",
        "py",
        "java",
        "c",
        "cpp",
        "cs",
        "sql",
        "xml",
        "yaml",
        "yml",
        "log",
        "css",
        "scss",
        "sh",
        "bash"

      ].includes(
        extension
      );


    if (readable) {

      try {

        attachedText =
          await file.text();

      } catch {

        attachedText =
          "";

      }

    }

  }
);


document
  .getElementById(
    "removeFile"
  )
  .addEventListener(
    "click",
    clearAttachment
  );


function clearAttachment() {

  attachedFile =
    null;

  attachedText =
    "";

  fileInput.value =
    "";

  fileChipName.textContent =
    "";

  fileChip.classList.remove(
    "visible"
  );

}
