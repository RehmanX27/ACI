<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ACI · AI Consumption Intelligence</title>

  <style>
    :root {
      --bg: #050505;
      --panel: #0b0b0b;
      --panel-2: #101010;
      --border: #222;
      --border-soft: #181818;

      --text: #f5f5f5;
      --muted: #777;
      --muted-2: #555;

      --white: #f5f5f5;
      --black: #050505;

      --radius: 16px;
      --sidebar: 292px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================
       APP
    ========================================================= */

    .app {
      width: 100%;
      height: 100vh;
      display: flex;
      background: var(--bg);
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      width: var(--sidebar);
      height: 100vh;
      flex-shrink: 0;

      background: #080808;
      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;

      padding: 24px 22px 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;

      margin: 0 4px 26px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;

      border-radius: 10px;

      background:
        radial-gradient(
          circle at 30% 25%,
          #fff 0%,
          #cfcfcf 18%,
          #888 42%,
          #333 70%,
          #111 100%
        );

      box-shadow:
        0 0 0 1px #333,
        inset 0 0 12px rgba(255,255,255,.25);
    }

    .brand-name {
      font-size: 19px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .brand-sub {
      margin-top: 4px;

      font-size: 8px;
      letter-spacing: 2px;
      color: #5e5e5e;
      text-transform: uppercase;
    }

    .new-chat {
      width: 100%;
      min-height: 49px;

      border: 0;
      border-radius: 12px;

      background: #f2f2f2;
      color: #080808;

      font-size: 16px;
      font-weight: 750;

      text-align: left;
      padding: 0 18px;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .new-chat:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .history {
      margin-top: 34px;
      flex: 1;
      overflow-y: auto;
    }

    .history-label {
      margin: 0 9px 13px;

      color: #575757;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item {
      border: 0;
      background: transparent;

      color: #898989;

      width: 100%;
      padding: 9px 10px;

      border-radius: 9px;

      text-align: left;
      font-size: 12px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .history-item:hover {
      color: #eee;
      background: #111;
    }

    .history-empty {
      color: #444;
      font-size: 11px;
      padding: 8px 10px;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border);
      padding: 18px 3px 0;

      color: #525252;
      font-size: 10px;
    }

    .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;

      background: #67f5a0;

      margin-right: 7px;

      box-shadow: 0 0 10px rgba(103,245,160,.5);
    }

    /* =========================================================
       MAIN
    ========================================================= */

    .main {
      min-width: 0;
      flex: 1;
      height: 100vh;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(255,255,255,.045),
          transparent 42%
        ),
        #050505;
    }

    .topbar {
      height: 70px;
      flex-shrink: 0;

      border-bottom: 1px solid var(--border-soft);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px 0 30px;
    }

    .topbar-label {
      color: #666;
      font-size: 11px;
      letter-spacing: .2px;
    }

    .topbar-new {
      border: 1px solid #292929;
      background: #0b0b0b;
      color: #aaa;

      border-radius: 9px;

      padding: 9px 13px;

      font-size: 11px;
    }

    .topbar-new:hover {
      color: #fff;
      border-color: #444;
    }

    /* =========================================================
       WORKSPACE
    ========================================================= */

    .workspace {
      flex: 1;
      min-height: 0;

      overflow-y: auto;

      position: relative;

      display: flex;
      flex-direction: column;
    }

    .workspace-inner {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;

      min-height: 100%;

      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       AI SIGNAL
    ========================================================= */

    .signal-area {
      padding-top: 62px;
      padding-bottom: 34px;

      transition:
        opacity .25s ease,
        transform .25s ease;
    }

    .signal-kicker {
      display: flex;
      align-items: center;
      gap: 9px;

      color: #626262;

      font-size: 10px;
      font-weight: 700;

      letter-spacing: 1.6px;
      text-transform: uppercase;

      margin-bottom: 17px;
    }

    .signal-kicker::before {
      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: #eee;
      box-shadow: 0 0 10px rgba(255,255,255,.3);
    }

    /*
      IMPORTANT:
      This replaces the giant 6-line headline.

      Maximum target:
      10 words.

      The typography is intentionally editorial,
      but much smaller so it doesn't dominate the workspace.
    */

    .signal-text {
      max-width: 900px;

      font-size: clamp(32px, 4vw, 58px);

      line-height: .98;

      font-weight: 850;

      letter-spacing: -2.8px;

      color: #f2f2f2;

      margin: 0;

      text-wrap: balance;
    }

    .signal-meta {
      margin-top: 19px;

      color: #4f4f4f;

      font-size: 10px;
      letter-spacing: .4px;
    }

    .signal-loading {
      color: #777;
    }

    /* =========================================================
       CHAT
    ========================================================= */

    .chat-area {
      flex: 1;

      display: flex;
      flex-direction: column;

      min-height: 260px;
    }

    .messages {
      flex: 1;

      display: flex;
      flex-direction: column;

      gap: 22px;

      padding-bottom: 28px;
    }

    .message {
      display: flex;
      width: 100%;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: min(760px, 88%);

      border-radius: 15px;

      padding: 15px 17px;

      font-size: 14px;
      line-height: 1.65;

      white-space: pre-wrap;
      word-break: break-word;
    }

    .user .bubble {
      background: #f2f2f2;
      color: #090909;

      border-bottom-right-radius: 4px;
    }

    .ai .bubble {
      background: #0e0e0e;
      color: #dedede;

      border: 1px solid #202020;

      border-bottom-left-radius: 4px;
    }

    .message-label {
      font-size: 9px;
      color: #555;

      letter-spacing: 1.3px;
      text-transform: uppercase;

      margin-bottom: 7px;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing span {
      width: 4px;
      height: 4px;

      border-radius: 50%;

      background: #999;

      animation: blink 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }

    /* =========================================================
       TRACE
    ========================================================= */

    .trace {
      margin-top: -4px;
      margin-bottom: 18px;

      display: none;

      border: 1px solid #1e1e1e;
      border-radius: 12px;

      background: #090909;

      padding: 12px 14px;

      font-size: 10px;
      color: #656565;
    }

    .trace.visible {
      display: block;
    }

    .trace-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .trace-pill {
      border: 1px solid #202020;
      background: #0d0d0d;

      padding: 6px 8px;

      border-radius: 7px;
    }

    .trace-pill strong {
      color: #aaa;
      font-weight: 650;
    }

    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    .suggestions {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      padding-bottom: 12px;
    }

    .suggestion {
      border: 1px solid #222;
      background: #090909;

      color: #747474;

      border-radius: 999px;

      padding: 8px 12px;

      font-size: 10px;

      transition:
        color .15s ease,
        border-color .15s ease,
        background .15s ease;
    }

    .suggestion:hover {
      color: #eee;
      border-color: #444;
      background: #101010;
    }

    /* =========================================================
       COMPOSER
    ========================================================= */

    .composer-wrap {
      position: sticky;
      bottom: 0;

      padding-top: 6px;
      padding-bottom: 26px;

      background:
        linear-gradient(
          to bottom,
          transparent,
          #050505 16%
        );
    }

    .attachment {
      display: none;

      align-items: center;
      gap: 9px;

      width: fit-content;

      margin-bottom: 8px;

      border: 1px solid #252525;
      background: #0d0d0d;

      color: #aaa;

      border-radius: 9px;

      padding: 7px 10px;

      font-size: 10px;
    }

    .attachment.visible {
      display: flex;
    }

    .attachment-name {
      max-width: 260px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-file {
      border: 0;
      background: transparent;

      color: #666;

      padding: 0 2px;
      font-size: 14px;
    }

    .remove-file:hover {
      color: #fff;
    }

    .composer {
      border: 1px solid #292929;
      background: #0b0b0b;

      border-radius: 17px;

      box-shadow:
        0 15px 45px rgba(0,0,0,.25);

      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    .composer:focus-within {
      border-color: #444;

      box-shadow:
        0 15px 50px rgba(0,0,0,.4);
    }

    .textarea {
      display: block;

      width: 100%;

      min-height: 72px;
      max-height: 230px;

      resize: none;

      border: 0;
      outline: 0;

      background: transparent;

      color: #eee;

      padding: 17px 17px 10px;

      font-size: 14px;
      line-height: 1.5;
    }

    .textarea::placeholder {
      color: #505050;
    }

    .composer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 7px 9px 9px 12px;
    }

    .composer-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-button {
      width: 34px;
      height: 34px;

      border: 1px solid transparent;
      background: transparent;

      color: #666;

      border-radius: 9px;

      display: grid;
      place-items: center;

      font-size: 16px;
    }

    .icon-button:hover {
      color: #eee;
      background: #151515;
      border-color: #242424;
    }

    .send-button {
      width: 38px;
      height: 38px;

      border: 0;

      border-radius: 11px;

      background: #f1f1f1;
      color: #050505;

      display: grid;
      place-items: center;

      font-size: 17px;
      font-weight: 800;

      transition:
        transform .15s ease,
        background .15s ease;
    }

    .send-button:hover {
      background: #fff;
      transform: translateY(-1px);
    }

    .send-button:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .composer-note {
      margin-top: 8px;

      text-align: center;

      color: #404040;

      font-size: 9px;
    }

    #fileInput {
      display: none;
    }

    /* =========================================================
       EMPTY / ERROR
    ========================================================= */

    .error-message {
      color: #d88888;

      border: 1px solid #382020;
      background: #110909;

      border-radius: 10px;

      padding: 11px 13px;

      font-size: 11px;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {
      body {
        overflow: auto;
      }

      .app {
        min-height: 100vh;
        height: auto;
      }

      .sidebar {
        display: none;
      }

      .main {
        min-height: 100vh;
        height: auto;
      }

      .topbar {
        height: 58px;
        padding: 0 16px;
      }

      .workspace-inner {
        width: calc(100% - 28px);
      }

      .signal-area {
        padding-top: 42px;
        padding-bottom: 28px;
      }

      .signal-text {
        font-size: clamp(30px, 10vw, 46px);
        letter-spacing: -1.8px;
      }

      .chat-area {
        min-height: 220px;
      }

      .composer-wrap {
        padding-bottom: 16px;
      }

      .suggestions {
        overflow-x: auto;
        flex-wrap: nowrap;

        scrollbar-width: none;
      }

      .suggestions::-webkit-scrollbar {
        display: none;
      }

      .suggestion {
        white-space: nowrap;
      }
    }

    @media (max-width: 480px) {
      .topbar-label {
        font-size: 10px;
      }

      .topbar-new {
        display: none;
      }

      .signal-text {
        font-size: 31px;
        line-height: 1.02;
      }

      .bubble {
        max-width: 94%;
        font-size: 13px;
      }

      .textarea {
        min-height: 65px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =======================================================
       SIDEBAR
  ======================================================== -->

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-mark"></div>

      <div>
        <div class="brand-name">ACI</div>
        <div class="brand-sub">Intelligence</div>
      </div>
    </div>

    <button
      class="new-chat"
      id="newChatButton"
      type="button"
    >
      + New chat
    </button>

    <div class="history">

      <div class="history-label">
        Today
      </div>

      <div
        class="history-list"
        id="historyList"
      >
        <div class="history-empty">
          No conversations yet.
        </div>
      </div>

    </div>

    <div class="sidebar-footer">
      <span class="status-dot"></span>
      ACI systems operational
    </div>

  </aside>


  <!-- =======================================================
       MAIN
  ======================================================== -->

  <main class="main">

    <header class="topbar">

      <div class="topbar-label">
        Enterprise AI workspace
      </div>

      <button
        class="topbar-new"
        id="topNewChat"
        type="button"
      >
        + New chat
      </button>

    </header>


    <section class="workspace">

      <div class="workspace-inner">

        <!-- =================================================
             AI SIGNAL
        ================================================== -->

        <section class="signal-area" id="signalArea">

          <div class="signal-kicker">
            AI / Technology signal
          </div>

          <h1
            class="signal-text"
            id="signalText"
          >
            AI is becoming infrastructure, not just software.
          </h1>

          <div
            class="signal-meta"
            id="signalMeta"
          >
            Fresh intelligence signal
          </div>

        </section>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section class="chat-area">

          <div
            class="messages"
            id="messages"
          ></div>

          <div
            class="trace"
            id="trace"
          >
            <div class="trace-grid" id="traceGrid"></div>
          </div>

        </section>


        <!-- =================================================
             SUGGESTIONS
        ================================================== -->

        <div
          class="suggestions"
          id="suggestions"
        ></div>


        <!-- =================================================
             COMPOSER
        ================================================== -->

        <div class="composer-wrap">

          <div
            class="attachment"
            id="attachment"
          >

            <span>📎</span>

            <span
              class="attachment-name"
              id="attachmentName"
            ></span>

            <button
              class="remove-file"
              id="removeFile"
              type="button"
              aria-label="Remove attachment"
            >
              ×
            </button>

          </div>


          <div class="composer">

            <textarea
              class="textarea"
              id="prompt"
              rows="1"
              placeholder="Ask ACI anything..."
              autocomplete="off"
            ></textarea>


            <div class="composer-bottom">

              <div class="composer-left">

                <button
                  class="icon-button"
                  id="attachButton"
                  type="button"
                  title="Attach a file"
                  aria-label="Attach a file"
                >
                  +
                </button>

              </div>


              <button
                class="send-button"
                id="sendButton"
                type="button"
                title="Send"
                aria-label="Send"
              >
                ↑
              </button>

            </div>

          </div>


          <div class="composer-note">
            ACI automatically selects the appropriate approved AI model.
          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<input
  id="fileInput"
  type="file"
  accept=".pdf,.txt,.md,.csv,.json,.js,.jsx,.ts,.tsx,.py,.java,.sql,.html,.css,.xml,.doc,.docx,.xls,.xlsx,.ppt,.pptx,image/*"
/>


<script>
/* ============================================================
   ACI EMPLOYEE WORKSPACE
============================================================ */

const promptInput = document.getElementById("prompt");
const sendButton = document.getElementById("sendButton");

const attachButton = document.getElementById("attachButton");
const fileInput = document.getElementById("fileInput");

const attachment = document.getElementById("attachment");
const attachmentName = document.getElementById("attachmentName");
const removeFile = document.getElementById("removeFile");

const messages = document.getElementById("messages");

const suggestions = document.getElementById("suggestions");

const signalText = document.getElementById("signalText");
const signalMeta = document.getElementById("signalMeta");

const signalArea = document.getElementById("signalArea");

const trace = document.getElementById("trace");
const traceGrid = document.getElementById("traceGrid");

const historyList = document.getElementById("historyList");

const newChatButton = document.getElementById("newChatButton");
const topNewChat = document.getElementById("topNewChat");


/* ============================================================
   STATE
============================================================ */

let selectedFile = null;

let conversation = [];

let isSending = false;


/* ============================================================
   SUGGESTIONS
============================================================ */

const suggestionLibrary = [
  "Analyze this business idea.",
  "Summarize this document.",
  "Explain this error.",
  "Draft an email to my manager.",
  "Compare two technology approaches.",
  "Review this code.",
  "Create a project plan.",
  "Analyze this market.",
  "Explain this concept simply.",
  "Find the key risks.",
  "Turn this into an executive summary.",
  "Create a professional response.",
  "Review this proposal.",
  "Analyze this financial scenario.",
  "Prepare meeting action items.",
  "Help me solve this problem."
];


function renderSuggestions() {

  suggestions.innerHTML = "";

  const shuffled = [...suggestionLibrary]
    .sort(() => Math.random() - 0.5)
    .slice(0, 5);

  shuffled.forEach(text => {

    const button = document.createElement("button");

    button.type = "button";

    button.className = "suggestion";

    button.textContent = text;

    button.addEventListener("click", () => {

      promptInput.value = text;

      autoResize();

      promptInput.focus();

    });

    suggestions.appendChild(button);

  });
}


/* ============================================================
   SIGNAL
============================================================ */

/*
  The backend /api/insight should return a short editorial signal.

  Expected response:

  {
    "text": "AI agents are moving from experiments into workflows."
  }

  The frontend also enforces a maximum of 10 words.
*/

function limitToTenWords(text) {

  if (!text) {
    return "AI is becoming infrastructure, not just software.";
  }

  const words = text
    .trim()
    .split(/\s+/)
    .slice(0, 10);

  let result = words.join(" ");

  /*
    Avoid awkward cutoff punctuation.
  */

  if (!/[.!?]$/.test(result)) {
    result += ".";
  }

  return result;
}


async function loadInsight() {

  signalArea.style.opacity = "0.45";

  try {

    const response = await fetch(
      "/api/insight",
      {
        method: "GET",
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("Insight unavailable");
    }

    const data = await response.json();

    const text =
      data.text ||
      data.insight ||
      data.headline ||
      "";

    signalText.textContent = limitToTenWords(text);

    signalMeta.textContent =
      "Fresh intelligence signal · " +
      new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

  } catch (error) {

    const fallbackSignals = [
      "AI is becoming infrastructure, not just software.",
      "Cheap intelligence is changing how businesses operate.",
      "AI agents are moving deeper into workflows.",
      "Model choice is becoming an economic decision.",
      "Enterprise AI is shifting from pilots to production.",
      "AI infrastructure is becoming a strategic advantage.",
      "The next AI advantage may come from routing.",
      "More AI usage means more economics to manage.",
      "AI capability is becoming increasingly commoditized.",
      "The valuable layer may sit above the models."
    ];

    const random =
      fallbackSignals[
        Math.floor(Math.random() * fallbackSignals.length)
      ];

    signalText.textContent = limitToTenWords(random);

    signalMeta.textContent =
      "ACI intelligence signal";

  } finally {

    setTimeout(() => {
      signalArea.style.opacity = "1";
    }, 120);

  }
}


/* ============================================================
   TEXTAREA
============================================================ */

function autoResize() {

  promptInput.style.height = "auto";

  promptInput.style.height =
    Math.min(promptInput.scrollHeight, 230) + "px";
}


promptInput.addEventListener(
  "input",
  autoResize
);


promptInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      if (!isSending) {
        sendPrompt();
      }
    }

  }
);

/* ============================================================
   FILE READING
============================================================ */

function readFileAsText(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {
      resolve(reader.result);
    };

    reader.onerror = () => {
      reject(
        new Error("Could not read the file.")
      );
    };

    reader.readAsText(file);

  });

}


function readFileAsBase64(file) {

  return new Promise((resolve, reject) => {

    const reader = new FileReader();

    reader.onload = () => {

      const result = reader.result || "";

      const comma =
        result.indexOf(",");

      resolve(
        comma >= 0
          ? result.slice(comma + 1)
          : result
      );

    };

    reader.onerror = () => {
      reject(
        new Error("Could not process the attachment.")
      );
    };

    reader.readAsDataURL(file);

  });

}


/* ============================================================
   PREPARE FILE FOR GEMINI
============================================================ */

async function prepareFileForAI(file) {

  if (!file) {
    return null;
  }

  /*
    Browser → Vercel JSON → Gemini.

    Keep the upload conservative because Base64
    increases the payload size by roughly 33%.
  */

  const MAX_FILE_SIZE = 2.8 * 1024 * 1024;

  if (file.size > MAX_FILE_SIZE) {

    throw new Error(
      "For now, attachments must be smaller than 2.8 MB."
    );

  }


  /*
    PDF

    Sent as native document data to Gemini.
  */

  if (
    file.type === "application/pdf" ||
    file.name.toLowerCase().endsWith(".pdf")
  ) {

    const base64 =
      await readFileAsBase64(file);

    return {
      name: file.name,
      mimeType: "application/pdf",
      base64
    };

  }


  /*
    IMAGE

    Sent as native image data to Gemini.
  */

  if (
    file.type &&
    file.type.startsWith("image/")
  ) {

    const base64 =
      await readFileAsBase64(file);

    return {
      name: file.name,
      mimeType: file.type,
      base64
    };

  }


  /*
    TEXT / CODE

    Extract in browser and send text to backend.
  */

  const text =
    await readFileAsText(file);

  return {
    name: file.name,
    mimeType:
      file.type || "text/plain",
    extractedText: text
  };

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
  role,
  content
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " + role;


  const inner =
    document.createElement("div");


  const label =
    document.createElement("div");

  label.className =
    "message-label";

  label.textContent =
    role === "user"
      ? "You"
      : "ACI";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  bubble.textContent =
    content;


  inner.appendChild(label);
  inner.appendChild(bubble);

  wrapper.appendChild(inner);

  messages.appendChild(wrapper);

  scrollToBottom();

  return bubble;

}


/* ============================================================
   TYPING MESSAGE
============================================================ */

function addTypingMessage() {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message ai";


  const inner =
    document.createElement("div");


  const label =
    document.createElement("div");

  label.className =
    "message-label";

  label.textContent =
    "ACI";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const typing =
    document.createElement("div");

  typing.className =
    "typing";


  typing.innerHTML =
    "<span></span><span></span><span></span>";


  bubble.appendChild(typing);

  inner.appendChild(label);
  inner.appendChild(bubble);

  wrapper.appendChild(inner);

  messages.appendChild(wrapper);

  scrollToBottom();

  return wrapper;

}


/* ============================================================
   ERROR
============================================================ */

function addError(message) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message ai";


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble error-message";

  bubble.textContent =
    message;


  wrapper.appendChild(bubble);

  messages.appendChild(wrapper);

  scrollToBottom();

}


/* ============================================================
   TRACE
============================================================ */

function renderTrace(data) {

  traceGrid.innerHTML = "";

  if (!data) {
    trace.classList.remove("visible");
    return;
  }


  const items = [
    ["Task", data.taskType],
    ["Complexity", data.complexity + "/5"],
    ["Sensitivity", data.sensitivity],
    ["Quality", data.requiredQuality + "%"],
    ["Model", data.model],
    ["Provider", data.provider],
    ["Tier", data.routingTier],
    ["Tokens", data.totalTokens],
    ["Latency", data.latencyMs + "ms"],
    ["Outcome", data.outcome],
    [
      "Fallback",
      data.fallbackUsed ? "YES" : "NO"
    ]
  ];


  items.forEach(([label, value]) => {

    if (
      value === undefined ||
      value === null
    ) {
      return;
    }

    const pill =
      document.createElement("div");

    pill.className =
      "trace-pill";

    const strong =
      document.createElement("strong");

    strong.textContent =
      label + ": ";

    const span =
      document.createElement("span");

    span.textContent =
      String(value);

    pill.appendChild(strong);
    pill.appendChild(span);

    traceGrid.appendChild(pill);

  });


  trace.classList.add("visible");

}


/* ============================================================
   SEND PROMPT
============================================================ */

async function sendPrompt() {

  if (isSending) {
    return;
  }


  const typedPrompt =
    promptInput.value.trim();


  /*
    If a file exists and no prompt was typed,
    give the model an explicit instruction.
  */

  const requestPrompt =
    typedPrompt ||
    (
      selectedFile
        ? "Analyze the attached file and provide the most useful summary or insights."
        : ""
    );


  if (!requestPrompt) {
    promptInput.focus();
    return;
  }


  isSending = true;

  sendButton.disabled = true;


  /*
    Hide suggestions once the actual conversation starts.
  */

  suggestions.style.display = "none";


  /*
    Add user message.
  */

  let displayPrompt =
    requestPrompt;

  if (selectedFile) {

    displayPrompt +=
      "\n\n📎 " +
      selectedFile.name;

  }

  addMessage(
    "user",
    displayPrompt
  );


  conversation.push({
    role: "user",
    content: requestPrompt
  });


  /*
    Clear composer immediately.
  */

  promptInput.value = "";

  autoResize();


  /*
    Prepare attachment.
  */

  let filePayload = null;

  try {

    if (selectedFile) {

      filePayload =
        await prepareFileForAI(
          selectedFile
        );

    }

  } catch (error) {

    addError(
      error?.message ||
      "Unable to process the attachment."
    );

    isSending = false;

    sendButton.disabled = false;

    return;

  }


  /*
    Loading state.
  */

  const typing =
    addTypingMessage();


  /*
    Remove attachment after preparation.
  */

  selectedFile = null;

  fileInput.value = "";

  attachment.classList.remove("visible");

  attachmentName.textContent = "";


  /*
    Hide previous trace.
  */

  trace.classList.remove("visible");


  try {

    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            prompt: requestPrompt,
            file: filePayload
          })
        }
      );


    /*
      Always parse safely.
      If Vercel returns HTML instead of JSON,
      show a useful error rather than throwing
      "Unexpected token <".
    */

    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    let data;


    if (
      contentType.includes(
        "application/json"
      )
    ) {

      data =
        await response.json();

    } else {

      const raw =
        await response.text();

      throw new Error(
        response.ok
          ? "ACI returned an invalid response."
          : "ACI server error (" +
            response.status +
            ")."
      );

    }


    if (!response.ok) {

      throw new Error(
        data?.error ||
        "AI request failed."
      );

    }


    /*
      Remove typing.
    */

    typing.remove();


    /*
      AI response.
    */

    const answer =
      data?.answer ||
      "ACI returned an empty response.";


    addMessage(
      "ai",
      answer
    );


    conversation.push({
      role: "assistant",
      content: answer
    });


    /*
      Show economics/routing trace.
    */

    renderTrace(
      data?.trace
    );


    /*
      Add conversation to sidebar.
    */

    saveConversation(
      requestPrompt
    );


  } catch (error) {

    typing.remove();


    addError(
      error?.message ||
      "Something went wrong while contacting ACI."
    );

  } finally {

    isSending = false;

    sendButton.disabled = false;

    promptInput.focus();

  }

}


/* ============================================================
   SEND BUTTON
============================================================ */

sendButton.addEventListener(
  "click",
  sendPrompt
);

/* ============================================================
   HISTORY
============================================================ */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "aci_history"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveConversation(title) {

  const cleanTitle =
    title
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 65);


  if (!cleanTitle) {
    return;
  }


  let history =
    getHistory();


  /*
    Avoid repeated identical entries.
  */

  if (
    history.length &&
    history[0].title === cleanTitle
  ) {
    return;
  }


  history.unshift({
    title: cleanTitle,
    timestamp: Date.now()
  });


  history =
    history.slice(0, 20);


  localStorage.setItem(
    "aci_history",
    JSON.stringify(history)
  );


  renderHistory();

}


function renderHistory() {

  const history =
    getHistory();


  historyList.innerHTML = "";


  if (!history.length) {

    const empty =
      document.createElement("div");

    empty.className =
      "history-empty";

    empty.textContent =
      "No conversations yet.";

    historyList.appendChild(empty);

    return;

  }


  history.forEach(item => {

    const button =
      document.createElement("button");

    button.type = "button";

    button.className =
      "history-item";

    button.textContent =
      item.title;


    /*
      History is currently intentionally lightweight.
      Clicking starts a fresh workspace because we
      aren't storing complete conversations locally.
    */

    button.addEventListener(
      "click",
      () => {

        promptInput.value =
          item.title;

        autoResize();

        promptInput.focus();

      }
    );


    historyList.appendChild(
      button
    );

  });

}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

  const workspace =
    document.querySelector(
      ".workspace"
    );

  requestAnimationFrame(() => {

    workspace.scrollTo({
      top: workspace.scrollHeight,
      behavior: "smooth"
    });

  });

}


/* ============================================================
   INITIALIZE
============================================================ */

renderSuggestions();

renderHistory();

loadInsight();

autoResize();

promptInput.focus();


/*
  Refresh the AI signal periodically.

  This keeps the landing signal fresh
  without refreshing the whole page.
*/

setInterval(
  loadInsight,
  10 * 60 * 1000
);
