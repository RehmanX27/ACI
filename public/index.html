<!doctype html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>ACI · Intelligence</title>

<style>

/* =========================================================
   ACI DESIGN SYSTEM
========================================================= */

:root{

  --bg:#050505;
  --surface:#0b0b0b;
  --surface2:#111111;
  --surface3:#171717;

  --border:#242424;
  --border2:#303030;

  --text:#f4f4f4;
  --text2:#b3b3b3;
  --muted:#666;
  --muted2:#444;

  --accent:#ffffff;
  --accentSoft:rgba(255,255,255,.07);

  --userBg:#f4f4f4;
  --userText:#050505;

  --green:#63e6a0;
  --red:#ef8585;

  --sidebar:285px;
}


/* =========================================================
   LIGHT
========================================================= */

body[data-theme="light"]{

  --bg:#f5f5f2;
  --surface:#ffffff;
  --surface2:#eeeeeb;
  --surface3:#e4e4e1;

  --border:#d9d9d5;
  --border2:#c9c9c5;

  --text:#111111;
  --text2:#555555;
  --muted:#777;
  --muted2:#999;

  --accent:#111111;
  --accentSoft:rgba(0,0,0,.06);

  --userBg:#111111;
  --userText:#ffffff;
}


/* =========================================================
   ACCENTS
========================================================= */

body[data-accent="blue"]{

  --accent:#5da7ff;
  --accentSoft:rgba(93,167,255,.10);
}

body[data-theme="light"][data-accent="blue"]{
  --accent:#1769d2;
}


body[data-accent="violet"]{

  --accent:#a78bfa;
  --accentSoft:rgba(167,139,250,.10);
}

body[data-theme="light"][data-accent="violet"]{
  --accent:#7047c4;
}


body[data-accent="green"]{

  --accent:#55d99a;
  --accentSoft:rgba(85,217,154,.10);
}

body[data-theme="light"][data-accent="green"]{
  --accent:#168653;
}


body[data-accent="orange"]{

  --accent:#ff9d52;
  --accentSoft:rgba(255,157,82,.10);
}

body[data-theme="light"][data-accent="orange"]{
  --accent:#c96513;
}


body[data-accent="pink"]{

  --accent:#f472b6;
  --accentSoft:rgba(244,114,182,.10);
}

body[data-theme="light"][data-accent="pink"]{
  --accent:#c63b7e;
}


/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;

  background:var(--bg);

  color:var(--text);

  font-family:
    Inter,
    ui-sans-serif,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  transition:
    background .25s ease,
    color .25s ease;
}

body{
  overflow:hidden;
}

button,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}


/* =========================================================
   APP
========================================================= */

.app{

  width:100%;
  height:100vh;

  display:flex;

  background:var(--bg);
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{

  width:var(--sidebar);

  height:100vh;

  flex-shrink:0;

  padding:
    24px 21px 18px;

  display:flex;

  flex-direction:column;

  background:var(--surface);

  border-right:
    1px solid var(--border);
}


/* BRAND */

.brand{

  display:flex;

  align-items:center;

  gap:12px;

  padding-left:4px;

  margin-bottom:27px;
}

.logo{

  width:36px;
  height:36px;

  border-radius:11px;

  background:
    radial-gradient(
      circle at 30% 25%,
      #fff,
      #bbb 22%,
      #666 52%,
      #111 100%
    );

  box-shadow:
    0 0 0 1px #333,
    inset 0 0 13px rgba(255,255,255,.25);
}

.brandTitle{

  font-size:19px;

  line-height:1;

  font-weight:850;

  letter-spacing:-.5px;
}

.brandSub{

  margin-top:4px;

  color:var(--muted);

  font-size:8px;

  letter-spacing:2px;

  text-transform:uppercase;
}


/* NEW CHAT */

.newChat{

  height:48px;

  border:0;

  border-radius:12px;

  padding:
    0 17px;

  background:var(--accent);

  color:var(--bg);

  font-size:15px;

  font-weight:750;

  text-align:left;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

body[data-theme="light"] .newChat{
  color:#fff;
}

.newChat:hover{

  transform:
    translateY(-1px);

  opacity:.88;
}


/* HISTORY */

.history{

  flex:1;

  min-height:0;

  overflow:auto;

  margin-top:34px;
}

.historyLabel{

  margin:
    0 9px 12px;

  color:var(--muted);

  font-size:9px;

  font-weight:750;

  letter-spacing:2px;

  text-transform:uppercase;
}

.historyItem{

  width:100%;

  border:0;

  background:transparent;

  color:var(--text2);

  padding:
    9px 10px;

  border-radius:8px;

  text-align:left;

  font-size:12px;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.historyItem:hover{

  background:var(--accentSoft);

  color:var(--text);
}

.historyEmpty{

  color:var(--muted2);

  font-size:11px;

  padding:
    8px 10px;
}


/* STATUS */

.status{

  border-top:
    1px solid var(--border);

  padding:
    18px 3px 0;

  color:var(--muted);

  font-size:10px;
}

.statusDot{

  display:inline-block;

  width:7px;
  height:7px;

  margin-right:7px;

  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 9px rgba(99,230,160,.45);
}


/* =========================================================
   MAIN
========================================================= */

.main{

  flex:1;

  min-width:0;

  height:100vh;

  display:flex;

  flex-direction:column;

  background:var(--bg);
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{

  height:69px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    0 25px 0 30px;

  border-bottom:
    1px solid var(--border);
}

.topLabel{

  color:var(--muted);

  font-size:11px;
}


/* =========================================================
   APPEARANCE
========================================================= */

.themeWrap{
  position:relative;
}

.themeButton{

  height:36px;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:var(--surface);

  color:var(--text);

  padding:
    0 12px;

  font-size:11px;

  transition:
    border-color .15s ease;
}

.themeButton:hover{

  border-color:
    var(--border2);
}


.themeMenu{

  position:absolute;

  top:44px;

  right:0;

  z-index:100;

  width:235px;

  display:none;

  padding:13px;

  background:var(--surface);

  border:
    1px solid var(--border);

  border-radius:13px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.28);
}

.themeMenu.open{
  display:block;
}

.menuTitle{

  margin:
    2px 5px 9px;

  color:var(--muted);

  font-size:9px;

  letter-spacing:1.5px;

  text-transform:uppercase;
}

.themeChoices{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:6px;

  margin-bottom:14px;
}

.themeChoice{

  border:
    1px solid var(--border);

  border-radius:8px;

  background:var(--surface2);

  color:var(--text);

  padding:
    9px 8px;

  font-size:10px;

  text-align:left;
}

.themeChoice:hover,
.themeChoice.active{

  border-color:
    var(--accent);

  background:
    var(--accentSoft);
}

.accents{

  display:flex;

  gap:8px;

  padding:
    2px 4px 3px;

  flex-wrap:wrap;
}

.accent{

  width:25px;
  height:25px;

  border-radius:50%;

  border:
    2px solid transparent;

  padding:0;
}

.accent.active{

  border-color:
    var(--text);
}

.neutral{
  background:#999;
}

.blue{
  background:#5da7ff;
}

.violet{
  background:#a78bfa;
}

.green{
  background:#55d99a;
}

.orange{
  background:#ff9d52;
}

.pink{
  background:#f472b6;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace{

  flex:1;

  min-height:0;

  overflow:hidden;
}

.workspaceInner{

  width:
    min(
      1080px,
      calc(100% - 48px)
    );

  height:100%;

  margin:auto;

  display:flex;

  flex-direction:column;
}


/* =========================================================
   DYNAMIC HERO
========================================================= */

.hero{

  flex-shrink:0;

  padding:
    48px 0 27px;

  transition:
    padding .55s cubic-bezier(.2,.8,.2,1);
}


/* After conversation begins */

.workspace.started .hero{

  padding:
    15px 0 12px;
}


.signalHeader{

  display:flex;

  align-items:center;

  gap:9px;

  margin-bottom:15px;

  color:var(--muted);

  font-size:10px;

  font-weight:750;

  letter-spacing:1.6px;

  text-transform:uppercase;

  transition:
    margin .4s ease;
}

.workspace.started .signalHeader{

  margin-bottom:7px;
}

.signalDot{

  width:6px;
  height:6px;

  flex-shrink:0;

  border-radius:50%;

  background:var(--accent);

  box-shadow:
    0 0 10px var(--accent);
}


/*
  This is deliberately dynamic.
  It comes from /api/insight.
*/

.signalText{

  max-width:950px;

  margin:0;

  color:var(--text);

  font-size:
    clamp(
      30px,
      3.3vw,
      50px
    );

  line-height:1.03;

  font-weight:850;

  letter-spacing:-2.4px;

  text-wrap:balance;

  transition:
    font-size .55s cubic-bezier(.2,.8,.2,1),
    letter-spacing .55s ease,
    opacity .25s ease;
}


/*
  Once chatting starts, the signal becomes
  a small editorial strip instead of dominating.
*/

.workspace.started .signalText{

  max-width:760px;

  font-size:16px;

  line-height:1.3;

  letter-spacing:-.2px;

  font-weight:650;

  color:var(--text2);
}


.signalMeta{

  margin-top:11px;

  color:var(--muted2);

  font-size:9px;

  transition:
    opacity .3s ease;
}

.workspace.started .signalMeta{

  margin-top:5px;

  opacity:.6;
}


/* =========================================================
   CONVERSATION
========================================================= */

.chatScroll{

  flex:1;

  min-height:0;

  overflow-y:auto;

  padding:
    8px 0 20px;

  scrollbar-width:
    thin;

  scrollbar-color:
    var(--border)
    transparent;
}

.chatScroll::-webkit-scrollbar{
  width:5px;
}

.chatScroll::-webkit-scrollbar-thumb{

  background:
    var(--border);

  border-radius:20px;
}

.messages{

  display:flex;

  flex-direction:column;

  gap:24px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

  display:flex;

  width:100%;

  animation:
    messageIn .25s ease;
}

@keyframes messageIn{

  from{

    opacity:0;

    transform:
      translateY(7px);
  }

  to{

    opacity:1;

    transform:
      translateY(0);
  }
}

.message.user{
  justify-content:flex-end;
}

.message.ai{
  justify-content:flex-start;
}

.messageInner{

  max-width:
    min(
      820px,
      88%
    );
}

.label{

  margin-bottom:7px;

  color:var(--muted);

  font-size:9px;

  letter-spacing:1.3px;

  text-transform:uppercase;
}

.bubble{

  padding:
    15px 17px;

  border-radius:15px;

  font-size:14px;

  line-height:1.68;

  word-break:break-word;
}

.user .bubble{

  background:
    var(--userBg);

  color:
    var(--userText);

  border-bottom-right-radius:4px;
}

.ai .bubble{

  background:
    var(--surface);

  color:
    var(--text);

  border:
    1px solid var(--border);

  border-bottom-left-radius:4px;
}


/* =========================================================
   MARKDOWN
========================================================= */

.markdown p{

  margin:
    0 0 12px;
}

.markdown p:last-child{
  margin-bottom:0;
}

.markdown strong{
  font-weight:750;
}

.markdown ul{

  margin:
    8px 0;

  padding-left:21px;
}

.markdown li{
  margin:5px 0;
}

.markdown code{

  padding:
    2px 5px;

  border:
    1px solid var(--border);

  border-radius:5px;

  background:
    var(--surface2);

  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;

  font-size:12px;
}


/* =========================================================
   AI DECISION
========================================================= */

/*
  Internal intelligence is hidden by default.

  Employees see a tiny product signal.
  Admins can still inspect the routing data.
*/

.decision{

  display:none;

  margin-top:8px;
}

.decision.show{
  display:block;
}

.decisionButton{

  border:0;

  background:transparent;

  color:var(--muted);

  padding:
    4px 0;

  font-size:9px;

  letter-spacing:.2px;
}

.decisionButton:hover{
  color:var(--text2);
}

.decisionDetails{

  display:none;

  margin-top:7px;

  padding:
    10px;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:
    var(--surface2);
}

.decisionDetails.open{
  display:block;
}

.decisionGrid{

  display:flex;

  flex-wrap:wrap;

  gap:6px;
}

.decisionPill{

  border:
    1px solid var(--border);

  border-radius:6px;

  padding:
    5px 7px;

  color:var(--muted);

  font-size:9px;
}

.decisionPill b{
  color:var(--text2);
}


/* =========================================================
   TYPING
========================================================= */

.typing{

  display:flex;

  gap:4px;
}

.typing span{

  width:4px;
  height:4px;

  border-radius:50%;

  background:var(--muted);

  animation:
    blink 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes blink{

  0%,100%{
    opacity:.2;
  }

  50%{
    opacity:1;
  }
}


/* =========================================================
   SUGGESTIONS
========================================================= */

.suggestions{

  flex-shrink:0;

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  padding:
    6px 0 11px;
}

.suggestion{

  border:
    1px solid var(--border);

  background:
    var(--surface);

  color:
    var(--muted);

  border-radius:
    999px;

  padding:
    8px 12px;

  font-size:10px;

  transition:
    color .15s ease,
    border-color .15s ease,
    background .15s ease;
}

.suggestion:hover{

  color:var(--text);

  border-color:
    var(--accent);

  background:
    var(--accentSoft);
}


/* =========================================================
   COMPOSER
========================================================= */

.composerWrap{

  flex-shrink:0;

  padding:
    5px 0 20px;

  background:
    var(--bg);
}


/* FILE CHIP */

.attachment{

  display:none;

  width:max-content;

  max-width:100%;

  align-items:center;

  gap:8px;

  margin-bottom:8px;

  padding:
    7px 10px;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:
    var(--surface);

  color:
    var(--text2);

  font-size:10px;
}

.attachment.show{
  display:flex;
}

.fileName{

  max-width:340px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.removeFile{

  border:0;

  background:transparent;

  color:var(--muted);

  font-size:14px;
}

.removeFile:hover{
  color:var(--text);
}


/* COMPOSER */

.composer{

  border:
    1px solid var(--border2);

  background:
    var(--surface);

  border-radius:17px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.16);

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

.composer:focus-within{

  border-color:
    var(--accent);

  box-shadow:
    0 15px 60px rgba(0,0,0,.23);
}

textarea{

  display:block;

  width:100%;

  min-height:67px;

  max-height:190px;

  resize:none;

  border:0;

  outline:0;

  background:transparent;

  color:var(--text);

  padding:
    16px 17px 8px;

  font-size:14px;

  line-height:1.5;
}

textarea::placeholder{
  color:var(--muted);
}

.composerBottom{

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:
    6px 9px 9px 12px;
}

.attachButton{

  width:34px;
  height:34px;

  border:
    1px solid transparent;

  background:transparent;

  color:var(--muted);

  border-radius:9px;

  font-size:17px;
}

.attachButton:hover{

  background:
    var(--surface2);

  border-color:
    var(--border);

  color:
    var(--text);
}

.sendButton{

  width:39px;
  height:39px;

  border:0;

  border-radius:11px;

  background:
    var(--accent);

  color:
    var(--bg);

  font-size:17px;

  font-weight:850;

  transition:
    transform .15s ease,
    opacity .15s ease;
}

body[data-theme="light"] .sendButton{
  color:#fff;
}

.sendButton:hover{

  transform:
    translateY(-1px);

  opacity:.87;
}

.sendButton:disabled{

  opacity:.3;

  cursor:not-allowed;

  transform:none;
}

.composerNote{

  margin-top:7px;

  text-align:center;

  color:var(--muted2);

  font-size:9px;
}

#fileInput{
  display:none;
}


/* =========================================================
   ERROR
========================================================= */

.error{

  color:var(--red);

  border:
    1px solid rgba(239,133,133,.25);

  background:
    rgba(239,133,133,.05);

  border-radius:10px;

  padding:
    11px 13px;

  font-size:11px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .sidebar{
    display:none;
  }

  .topbar{

    height:58px;

    padding:
      0 15px;
  }

  .workspaceInner{

    width:
      calc(100% - 28px);
  }

  .hero{

    padding:
      30px 0 18px;
  }

  .signalText{

    font-size:
      30px;

    letter-spacing:
      -1.7px;
  }

  .workspace.started .signalText{

    font-size:
      15px;

    letter-spacing:
      -.1px;
  }

  .messageInner{
    max-width:94%;
  }

  .suggestions{

    flex-wrap:nowrap;

    overflow-x:auto;

    scrollbar-width:none;
  }

  .suggestions::-webkit-scrollbar{
    display:none;
  }

  .suggestion{
    white-space:nowrap;
  }

}

</style>

</head>


<body
  data-theme="dark"
  data-accent="neutral"
>


<div class="app">


<!-- =======================================================
     SIDEBAR
======================================================== -->

<aside class="sidebar">


  <div class="brand">

    <div class="logo"></div>

    <div>

      <div class="brandTitle">
        ACI
      </div>

      <div class="brandSub">
        Intelligence
      </div>

    </div>

  </div>


  <button
    class="newChat"
    id="newChat"
    type="button"
  >
    + New chat
  </button>


  <div class="history">

    <div class="historyLabel">
      Today
    </div>

    <div id="historyList">

      <div class="historyEmpty">
        No conversations yet.
      </div>

    </div>

  </div>


  <div class="status">

    <span class="statusDot"></span>

    ACI systems operational

  </div>


</aside>



<!-- =======================================================
     MAIN
======================================================== -->

<main class="main">


  <!-- TOP BAR -->

  <header class="topbar">

    <div class="topLabel">
      Enterprise AI workspace
    </div>


    <!-- APPEARANCE -->

    <div class="themeWrap">

      <button
        class="themeButton"
        id="themeButton"
        type="button"
      >
        ◐ Appearance
      </button>


      <div
        class="themeMenu"
        id="themeMenu"
      >

        <div class="menuTitle">
          Appearance
        </div>


        <div class="themeChoices">

          <button
            class="themeChoice"
            data-theme="dark"
            type="button"
          >
            🌑 Dark
          </button>

          <button
            class="themeChoice"
            data-theme="light"
            type="button"
          >
            ☀️ Light
          </button>

        </div>


        <div class="menuTitle">
          Accent
        </div>


        <div class="accents">

          <button
            class="accent neutral"
            data-accent="neutral"
            type="button"
            title="Neutral"
          ></button>

          <button
            class="accent blue"
            data-accent="blue"
            type="button"
            title="Blue"
          ></button>

          <button
            class="accent violet"
            data-accent="violet"
            type="button"
            title="Violet"
          ></button>

          <button
            class="accent green"
            data-accent="green"
            type="button"
            title="Green"
          ></button>

          <button
            class="accent orange"
            data-accent="orange"
            type="button"
            title="Orange"
          ></button>

          <button
            class="accent pink"
            data-accent="pink"
            type="button"
            title="Pink"
          ></button>

function limitWords(text){

  if (!text){

  const words =
    String(text)
      .trim()
      .split(/\s+/)
      .slice(0,10);


  let result =
    words.join(" ");


  if (
    !/[.!?]$/.test(result)
  ){

    result += ".";

  }


  return result;

}

/* =========================================================
   FILE READING
========================================================= */

function readBase64(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            String(
              reader.result || ""
            );


          const comma =
            result.indexOf(",");


          resolve(
            comma >= 0
              ? result.slice(
                  comma + 1
                )
              : result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not process the file."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


function readText(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            String(
              reader.result || ""
            )
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read the file."
            )
          );

        };


      reader.readAsText(
        file
      );

    }
  );

}


/* =========================================================
   PREPARE FILE
========================================================= */

async function prepareFile(file){

  if (!file){
    return null;
  }


  /*
    Conservative limit for browser → Vercel JSON.
  */

  if (
    file.size >
    2.8 * 1024 * 1024
  ){

    throw new Error(
      "Attachments are currently limited to 2.8 MB."
    );

  }


  /*
    PDF

    Native Gemini document processing.
  */

  if (
    file.type ===
      "application/pdf" ||

    file.name
      .toLowerCase()
      .endsWith(".pdf")
  ){

    return {

      name:
        file.name,

      mimeType:
        "application/pdf",

      base64:
        await readBase64(
          file
        )

    };

  }


  /*
    IMAGE
  */

  if (
    file.type &&
    file.type.startsWith(
      "image/"
    )
  ){

    return {

      name:
        file.name,

      mimeType:
        file.type,

      base64:
        await readBase64(
          file
        )

    };

  }


  /*
    TEXT / CODE
  */

  return {

    name:
      file.name,

    mimeType:
      file.type ||
      "text/plain",

    extractedText:
      await readText(
        file
      )

  };

}


/* =========================================================
   MARKDOWN
========================================================= */

function escapeHTML(text){

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function markdown(text){

  let html =
    escapeHTML(
      text
    );


  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  html =
    html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  const lines =
    html.split("\n");


  let output =
    "";

  let list =
    false;


  for (
    const line of lines
  ){

    if (
      /^\s*[-•]\s+/.test(
        line
      )
    ){

      if (!list){

        output +=
          "<ul>";

        list =
          true;

      }


      output +=
        "<li>" +
        line.replace(
          /^\s*[-•]\s+/,
          ""
        ) +
        "</li>";

    }else{

      if (list){

        output +=
          "</ul>";

        list =
          false;

      }


      if (line.trim()){

        output +=
          "<p>" +
          line +
          "</p>";

      }

    }

  }


  if (list){
    output += "</ul>";
  }


  return output;

}

        ? traceData.complexity + "/5"
        : "-"
    ],

    ],

    ],

    ],

    [

    ],

    ],

    [

    ],

    ],

/* =========================================================
   SEND
========================================================= */

async function sendPrompt(){

  if (sending){
    return;
  }


  const typed =
    prompt.value.trim();


  const requestPrompt =
    typed ||
    (
      selectedFile
        ? "Analyze the attached file and provide the most useful summary or insights."
        : ""
    );


  if (!requestPrompt){

    prompt.focus();

    return;

  }


  sending =
    true;

  sendButton.disabled =
    true;


  /*
    Move hero into compact mode.
  */

  startWorkspace();


  suggestions.style.display =
    "none";


  let display =
    requestPrompt;


  if (selectedFile){

    display +=
      "\n\n📎 " +
      selectedFile.name;

  }


  addMessage(
    "user",
    display
  );


  prompt.value =
    "";

  resizePrompt();


  let filePayload =
    null;


  try{

    filePayload =
      await prepareFile(
        selectedFile
      );

  }catch(error){

    addError(
      error.message
    );

    sending =
      false;

    sendButton.disabled =
      false;

    return;

  }


  const typing =
    addTyping();


  clearFile();


  try{

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              prompt:
                requestPrompt,

              file:
                filePayload

            })

        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    let data;


    if (
      contentType.includes(
        "application/json"
      )
    ){

      data =
        await response.json();

    }else{

      await response.text();

      throw new Error(
        "ACI returned an invalid server response."
      );

    }


    if (!response.ok){

      throw new Error(
        data?.error ||
        "ACI request failed."
      );

    }


    typing.remove();


    /*
      Add response.
    */

    const message =
      document.createElement(
        "div"
      );


    message.className =
      "message ai";


    const inner =
      document.createElement(
        "div"
      );


    inner.className =
      "messageInner";


    const label =
      document.createElement(
        "div"
      );


    label.className =
      "label";


    label.textContent =
      "ACI";


    const bubble =
      document.createElement(
        "div"
      );


    bubble.className =
      "bubble";


    const content =
      document.createElement(
        "div"
      );


    content.className =
      "markdown";


    content.innerHTML =
      markdown(
        data.answer ||
        "ACI returned an empty response."
      );


    bubble.appendChild(
      content
    );


    inner.append(
      label,
      bubble
    );


    /*
      Decision information is now
      deliberately secondary.
    */

    addDecision(
      inner,
      data.trace
    );


    message.appendChild(
      inner
    );


    messages.appendChild(
      message
    );


    scrollBottom();


    saveHistory(
      requestPrompt
    );


  }catch(error){

    typing.remove();


    addError(
      error.message ||
      "Something went wrong while contacting ACI."
    );


  }finally{

    sending =
      false;

    sendButton.disabled =
      false;

    prompt.focus();

  }

}

/* =========================================================
   HISTORY
========================================================= */

function getHistory(){

  try{

    return JSON.parse(
      localStorage.getItem(
        "aci_history"
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveHistory(title){

  const clean =
    title
      .replace(
        /\s+/g,
        " "
      )
      .trim()
      .slice(
        0,
        65
      );


  if (!clean){
    return;
  }


  let history =
    getHistory();


  if (
    history[0]?.title ===
    clean
  ){

    return;

  }


  history.unshift({

    title:
      clean,

    time:
      Date.now()

  });


  localStorage.setItem(
    "aci_history",
    JSON.stringify(
      history.slice(
        0,
        20
      )
    )
  );


  renderHistory();

}


function renderHistory(){

  const history =
    getHistory();


  historyList.innerHTML =
    "";


  if (!history.length){

    historyList.innerHTML =
      `
        <div class="historyEmpty">
          No conversations yet.
        </div>
      `;

    return;

  }


  history.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "historyItem";

      button.type =
        "button";

      button.textContent =
        item.title;


      button.addEventListener(
        "click",
        () => {

          prompt.value =
            item.title;

          resizePrompt();

          prompt.focus();

        }
      );


      historyList.appendChild(
        button
      );

    }
  );

}

}

  "click",
  newChat
);


/* =========================================================
   INITIALIZE
========================================================= */

renderSuggestions();

renderHistory();

resizePrompt();

loadSignal();

prompt.focus();


/*
  New live signal every 10 minutes.
*/

setInterval(
  loadSignal,
  10 * 60 * 1000
);

</script>
