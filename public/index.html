<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>ACI · AI Consumption Intelligence</title>

  <style>

    /* =========================================================
       THEME VARIABLES
    ========================================================= */

    :root {

      --bg: #050505;
      --bg-soft: #080808;

      --surface: #0c0c0c;
      --surface-2: #111111;
      --surface-3: #161616;

      --border: #242424;
      --border-soft: #181818;

      --text: #f3f3f3;
      --text-secondary: #b0b0b0;
      --muted: #666;
      --muted-2: #444;

      --accent: #ffffff;
      --accent-soft: rgba(255,255,255,.10);

      --user-bg: #f2f2f2;
      --user-text: #050505;

      --success: #67f5a0;
      --danger: #e97878;

      --sidebar-width: 292px;

      --radius: 15px;

      --shadow:
        0 20px 60px rgba(0,0,0,.25);
    }


    /* =========================================================
       ACCENT COLORS
    ========================================================= */

    body[data-accent="blue"] {
      --accent: #5ea7ff;
      --accent-soft: rgba(94,167,255,.12);
    }

    body[data-accent="violet"] {
      --accent: #a78bfa;
      --accent-soft: rgba(167,139,250,.12);
    }

    body[data-accent="green"] {
      --accent: #55d99a;
      --accent-soft: rgba(85,217,154,.12);
    }

    body[data-accent="orange"] {
      --accent: #ff9d52;
      --accent-soft: rgba(255,157,82,.12);
    }

    body[data-accent="pink"] {
      --accent: #f472b6;
      --accent-soft: rgba(244,114,182,.12);
    }


    /* =========================================================
       LIGHT THEME
    ========================================================= */

    body[data-theme="light"] {

      --bg: #f4f4f2;
      --bg-soft: #eeeeec;

      --surface: #ffffff;
      --surface-2: #f7f7f6;
      --surface-3: #eeeeec;

      --border: #dcdcd8;
      --border-soft: #e8e8e4;

      --text: #111111;
      --text-secondary: #555555;

      --muted: #777777;
      --muted-2: #999999;

      --accent: #111111;

      --user-bg: #111111;
      --user-text: #ffffff;

      --shadow:
        0 20px 50px rgba(0,0,0,.08);
    }


    body[data-theme="light"][data-accent="blue"] {
      --accent: #1769d2;
      --accent-soft: rgba(23,105,210,.10);
    }

    body[data-theme="light"][data-accent="violet"] {
      --accent: #6d42c1;
      --accent-soft: rgba(109,66,193,.10);
    }

    body[data-theme="light"][data-accent="green"] {
      --accent: #168653;
      --accent-soft: rgba(22,134,83,.10);
    }

    body[data-theme="light"][data-accent="orange"] {
      --accent: #c96513;
      --accent-soft: rgba(201,101,19,.10);
    }

    body[data-theme="light"][data-accent="pink"] {
      --accent: #c63b7e;
      --accent-soft: rgba(198,59,126,.10);
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
    }

    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      background: var(--bg);
      color: var(--text);

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background .2s ease,
        color .2s ease;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }


    /* =========================================================
       APP
    ========================================================= */

    .app {

      width: 100%;
      height: 100vh;

      display: flex;

      background: var(--bg);
    }


    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {

      width: var(--sidebar-width);

      height: 100vh;

      flex-shrink: 0;

      background: var(--surface);

      border-right:
        1px solid var(--border);

      display: flex;

      flex-direction: column;

      padding:
        24px 22px 18px;
    }


    /* BRAND */

    .brand {

      display: flex;

      align-items: center;

      gap: 12px;

      margin:
        0 4px 26px;
    }

    .brand-mark {

      width: 35px;
      height: 35px;

      border-radius: 10px;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff,
          #cfcfcf 20%,
          #888 42%,
          #333 70%,
          #111
        );

      box-shadow:
        0 0 0 1px #333,
        inset 0 0 12px rgba(255,255,255,.25);
    }

    .brand-name {

      font-size: 19px;

      font-weight: 800;

      letter-spacing: -.5px;

      line-height: 1;
    }

    .brand-sub {

      margin-top: 4px;

      font-size: 8px;

      letter-spacing: 2px;

      color: var(--muted);

      text-transform: uppercase;
    }


    /* NEW CHAT */

    .new-chat {

      width: 100%;

      min-height: 49px;

      border: 0;

      border-radius: 12px;

      background: var(--accent);

      color:
        var(--bg);

      font-size: 16px;

      font-weight: 750;

      text-align: left;

      padding: 0 18px;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    body[data-theme="light"] .new-chat {
      color: white;
    }

    .new-chat:hover {

      transform:
        translateY(-1px);

      opacity: .88;
    }


    /* HISTORY */

    .history {

      margin-top: 34px;

      flex: 1;

      min-height: 0;

      overflow-y: auto;
    }

    .history-label {

      margin:
        0 9px 13px;

      color: var(--muted);

      font-size: 9px;

      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .history-list {

      display: flex;

      flex-direction: column;

      gap: 3px;
    }

    .history-item {

      width: 100%;

      border: 0;

      background: transparent;

      color: var(--text-secondary);

      padding:
        9px 10px;

      border-radius: 9px;

      text-align: left;

      font-size: 12px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    .history-item:hover {

      background:
        var(--accent-soft);

      color:
        var(--text);
    }

    .history-empty {

      color: var(--muted-2);

      font-size: 11px;

      padding:
        8px 10px;
    }


    /* FOOTER */

    .sidebar-footer {

      border-top:
        1px solid var(--border);

      padding:
        18px 3px 0;

      color:
        var(--muted);

      font-size: 10px;
    }

    .status-dot {

      display: inline-block;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--success);

      margin-right: 7px;

      box-shadow:
        0 0 10px rgba(103,245,160,.5);
    }


    /* =========================================================
       MAIN
    ========================================================= */

    .main {

      min-width: 0;

      flex: 1;

      height: 100vh;

      display: flex;

      flex-direction: column;

      background: var(--bg);
    }


    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {

      height: 70px;

      flex-shrink: 0;

      border-bottom:
        1px solid var(--border-soft);

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        0 24px 0 30px;
    }

    .topbar-left {

      display: flex;

      align-items: center;

      gap: 10px;
    }

    .topbar-label {

      color:
        var(--muted);

      font-size: 11px;
    }


    /* =========================================================
       THEME CONTROL
    ========================================================= */

    .theme-wrapper {

      position: relative;
    }

    .theme-button {

      height: 35px;

      padding:
        0 11px;

      display: flex;

      align-items: center;

      gap: 7px;

      border:
        1px solid var(--border);

      background:
        var(--surface);

      color:
        var(--text-secondary);

      border-radius: 9px;

      font-size: 11px;
    }

    .theme-button:hover {

      color:
        var(--text);

      border-color:
        var(--muted);
    }

    .theme-menu {

      position: absolute;

      top: 44px;

      right: 0;

      width: 235px;

      padding: 12px;

      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 13px;

      box-shadow:
        var(--shadow);

      display: none;

      z-index: 1000;
    }

    .theme-menu.open {
      display: block;
    }

    .menu-title {

      color:
        var(--muted);

      font-size: 9px;

      letter-spacing: 1.5px;

      text-transform: uppercase;

      margin:
        4px 5px 9px;
    }


    /* THEME OPTIONS */

    .theme-options {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 6px;

      margin-bottom: 13px;
    }

    .theme-option {

      border:
        1px solid var(--border);

      background:
        var(--surface-2);

      color:
        var(--text-secondary);

      padding:
        9px 8px;

      border-radius: 8px;

      font-size: 10px;

      text-align: left;
    }

    .theme-option:hover,
    .theme-option.active {

      border-color:
        var(--accent);

      color:
        var(--text);

      background:
        var(--accent-soft);
    }


    /* ACCENTS */

    .accent-options {

      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      padding:
        2px 4px 5px;
    }

    .accent-dot {

      width: 25px;
      height: 25px;

      border-radius: 50%;

      border:
        2px solid transparent;

      padding: 0;
    }

    .accent-dot.active {

      border-color:
        var(--text);
    }

    .accent-neutral {
      background: #999;
    }

    .accent-blue {
      background: #5ea7ff;
    }

    .accent-violet {
      background: #a78bfa;
    }

    .accent-green {
      background: #55d99a;
    }

    .accent-orange {
      background: #ff9d52;
    }

    .accent-pink {
      background: #f472b6;
    }


    /* =========================================================
       WORKSPACE
       
       IMPORTANT FIX:
       The workspace itself does NOT scroll behind the composer.
       The conversation has its OWN scroll container.
    ========================================================= */

    .workspace {

      flex: 1;

      min-height: 0;

      overflow: hidden;

      position: relative;
    }

    .workspace-inner {

      width:
        min(1080px, calc(100% - 48px));

      height: 100%;

      margin:
        0 auto;

      display: flex;

      flex-direction: column;
    }


    /* =========================================================
       AI SIGNAL
    ========================================================= */

    .signal-area {

      flex-shrink: 0;

      padding:
        42px 0 25px;
    }

    .signal-kicker {

      display: flex;

      align-items: center;

      gap: 9px;

      color:
        var(--muted);

      font-size: 10px;

      font-weight: 700;

      letter-spacing:
        1.6px;

      text-transform:
        uppercase;

      margin-bottom:
        14px;
    }

    .signal-kicker::before {

      content: "";

      width: 6px;
      height: 6px;

      border-radius: 50%;

      background:
        var(--accent);

      box-shadow:
        0 0 10px var(--accent);
    }

    .signal-text {

      max-width: 900px;

      font-size:
        clamp(30px, 3.5vw, 51px);

      line-height:
        1.02;

      font-weight: 850;

      letter-spacing:
        -2.4px;

      color:
        var(--text);

      margin: 0;

      text-wrap: balance;

      transition:
        opacity .2s ease;
    }

    .signal-meta {

      margin-top:
        14px;

      color:
        var(--muted-2);

      font-size: 10px;
    }


    /* =========================================================
       CONVERSATION SCROLL AREA
       
       THIS IS THE MAIN GLITCH FIX.
    ========================================================= */

    .chat-scroll {

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        8px 0 24px;

      scrollbar-width:
        thin;

      scrollbar-color:
        var(--border)
        transparent;
    }

    .chat-scroll::-webkit-scrollbar {

      width: 6px;
    }

    .chat-scroll::-webkit-scrollbar-thumb {

      background:
        var(--border);

      border-radius:
        20px;
    }

    .messages {

      display: flex;

      flex-direction: column;

      gap: 22px;

      padding-right: 3px;
    }


    /* =========================================================
       MESSAGES
    ========================================================= */

    .message {

      display: flex;

      width: 100%;
    }

    .message.user {

      justify-content:
        flex-end;
    }

    .message.ai {

      justify-content:
        flex-start;
    }

    .message-inner {

      max-width:
        min(800px, 88%);
    }

    .bubble {

      border-radius:
        15px;

      padding:
        15px 17px;

      font-size:
        14px;

      line-height:
        1.68;

      word-break:
        break-word;

      box-shadow:
        0 2px 8px rgba(0,0,0,.03);
    }

    .user .bubble {

      background:
        var(--user-bg);

      color:
        var(--user-text);

      border-bottom-right-radius:
        4px;
    }

    .ai .bubble {

      background:
        var(--surface);

      color:
        var(--text);

      border:
        1px solid var(--border);

      border-bottom-left-radius:
        4px;
    }

    .message-label {

      font-size:
        9px;

      color:
        var(--muted);

      letter-spacing:
        1.3px;

      text-transform:
        uppercase;

      margin-bottom:
        7px;
    }


    /* =========================================================
       BASIC MARKDOWN
    ========================================================= */

    .markdown {

      white-space:
        normal;
    }

    .markdown p {

      margin:
        0 0 12px;
    }

    .markdown p:last-child {

      margin-bottom:
        0;
    }

    .markdown strong {

      font-weight:
        750;

      color:
        var(--text);
    }

    .markdown em {

      opacity:
        .9;
    }

    .markdown ul {

      margin:
        9px 0;

      padding-left:
        20px;
    }

    .markdown li {

      margin-bottom:
        5px;
    }

    .markdown code {

      background:
        var(--surface-3);

      border:
        1px solid var(--border);

      border-radius:
        5px;

      padding:
        2px 5px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      font-size:
        12px;
    }


    /* =========================================================
       TYPING
    ========================================================= */

    .typing {

      display:
        inline-flex;

      gap:
        4px;

      align-items:
        center;
    }

    .typing span {

      width:
        4px;

      height:
        4px;

      border-radius:
        50%;

      background:
        var(--muted);

      animation:
        blink 1s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay:
        .15s;
    }

    .typing span:nth-child(3) {
      animation-delay:
        .30s;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: .2;
      }

      50% {
        opacity: 1;
      }
    }


    /* =========================================================
       TRACE
    ========================================================= */

    .trace {

      display:
        none;

      margin:
        5px 0 15px;

      border:
        1px solid var(--border);

      border-radius:
        12px;

      background:
        var(--surface);

      padding:
        12px 14px;
    }

    .trace.visible {
      display:
        block;
    }

    .trace-grid {

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        7px;
    }

    .trace-pill {

      border:
        1px solid var(--border);

      background:
        var(--surface-2);

      padding:
        6px 8px;

      border-radius:
        7px;

      font-size:
        10px;

      color:
        var(--muted);
    }

    .trace-pill strong {

      color:
        var(--text-secondary);

      font-weight:
        650;
    }


    /* =========================================================
       SUGGESTIONS
    ========================================================= */

    .suggestions {

      flex-shrink: 0;

      display:
        flex;

      flex-wrap:
        wrap;

      gap:
        8px;

      padding:
        8px 0 11px;
    }

    .suggestion {

      border:
        1px solid var(--border);

      background:
        var(--surface);

      color:
        var(--text-secondary);

      border-radius:
        999px;

      padding:
        8px 12px;

      font-size:
        10px;

      transition:
        color .15s ease,
        border-color .15s ease,
        background .15s ease;
    }

    .suggestion:hover {

      color:
        var(--text);

      border-color:
        var(--accent);

      background:
        var(--accent-soft);
    }


    /* =========================================================
       COMPOSER
       
       NO STICKY.
       NO ABSOLUTE.
       NO OVERLAY.
       
       It occupies its own layout space.
    ========================================================= */

    .composer-wrap {

      flex-shrink: 0;

      padding:
        6px 0 22px;

      background:
        var(--bg);
    }


    /* ATTACHMENT */

    .attachment {

      display:
        none;

      align-items:
        center;

      gap:
        9px;

      width:
        fit-content;

      max-width:
        100%;

      margin-bottom:
        8px;

      border:
        1px solid var(--border);

      background:
        var(--surface);

      color:
        var(--text-secondary);

      border-radius:
        9px;

      padding:
        7px 10px;

      font-size:
        10px;
    }

    .attachment.visible {
      display:
        flex;
    }

    .attachment-name {

      max-width:
        320px;

      overflow:
        hidden;

      text-overflow:
        ellipsis;

      white-space:
        nowrap;
    }

    .remove-file {

      border:
        0;

      background:
        transparent;

      color:
        var(--muted);

      padding:
        0 2px;

      font-size:
        14px;
    }

    .remove-file:hover {

      color:
        var(--text);
    }


    /* COMPOSER */

    .composer {

      border:
        1px solid var(--border);

      background:
        var(--surface);

      border-radius:
        17px;

      box-shadow:
        var(--shadow);

      transition:
        border-color .15s ease;
    }

    .composer:focus-within {

      border-color:
        var(--accent);
    }


    /* TEXTAREA */

    .textarea {

      display:
        block;

      width:
        100%;

      min-height:
        67px;

      max-height:
        190px;

      resize:
        none;

      border:
        0;

      outline:
        0;

      background:
        transparent;

      color:
        var(--text);

      padding:
        16px 17px 8px;

      font-size:
        14px;

      line-height:
        1.5;
    }

    .textarea::placeholder {

      color:
        var(--muted);
    }


    /* COMPOSER BOTTOM */

    .composer-bottom {

      display:
        flex;

      align-items:
        center;

      justify-content:
        space-between;

      padding:
        6px 9px 9px 12px;
    }

    .composer-left {

      display:
        flex;

      align-items:
        center;

      gap:
        6px;
    }


    /* ICON */

    .icon-button {

      width:
        34px;

      height:
        34px;

      border:
        1px solid transparent;

      background:
        transparent;

      color:
        var(--muted);

      border-radius:
        9px;

      display:
        grid;

      place-items:
        center;

      font-size:
        17px;
    }

    .icon-button:hover {

      color:
        var(--text);

      background:
        var(--surface-2);

      border-color:
        var(--border);
    }


    /* SEND */

    .send-button {

      width:
        38px;

      height:
        38px;

      border:
        0;

      border-radius:
        11px;

      background:
        var(--accent);

      color:
        var(--bg);

      display:
        grid;

      place-items:
        center;

      font-size:
        17px;

      font-weight:
        800;

      transition:
        transform .15s ease,
        opacity .15s ease;
    }

    body[data-theme="light"] .send-button {
      color: white;
    }

    .send-button:hover {

      transform:
        translateY(-1px);

      opacity:
        .88;
    }

    .send-button:disabled {

      opacity:
        .35;

      cursor:
        not-allowed;

      transform:
        none;
    }


    /* NOTE */

    .composer-note {

      margin-top:
        7px;

      text-align:
        center;

      color:
        var(--muted-2);

      font-size:
        9px;
    }

    #fileInput {
      display:
        none;
    }


    /* =========================================================
       ERROR
    ========================================================= */

    .error-message {

      color:
        var(--danger);

      border:
        1px solid rgba(233,120,120,.25);

      background:
        rgba(233,120,120,.05);

      border-radius:
        10px;

      padding:
        11px 13px;

      font-size:
        11px;
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {

      body {
        overflow:
          hidden;
      }

      .sidebar {
        display:
          none;
      }

      .topbar {

        height:
          58px;

        padding:
          0 15px;
      }

      .workspace-inner {

        width:
          calc(100% - 28px);
      }

      .signal-area {

        padding:
          30px 0 20px;
      }

      .signal-text {

        font-size:
          clamp(29px, 8vw, 43px);

        letter-spacing:
          -1.8px;
      }

      .chat-scroll {

        padding-bottom:
          12px;
      }

      .message-inner {

        max-width:
          94%;
      }

      .suggestions {

        overflow-x:
          auto;

        flex-wrap:
          nowrap;

        scrollbar-width:
          none;
      }

      .suggestions::-webkit-scrollbar {
        display:
          none;
      }

      .suggestion {
        white-space:
          nowrap;

/* ============================================================

const body =

/* ============================================================

/* ============================================================

function applyTheme() {

  const accent =
    localStorage.getItem("aci_accent") ||
    "neutral";


  body.dataset.theme =

  body.dataset.accent =

  document
    .querySelectorAll("[data-theme-choice]")

        "active",
        button.dataset.accentChoice === accent
      );

    });

}


document
  .querySelectorAll("[data-theme-choice]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const theme =
          button.dataset.themeChoice;

        localStorage.setItem(
          "aci_theme",
          theme
        );

        applyTheme();

      }
    );

  });


document
  .querySelectorAll("[data-accent-choice]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const accent =
          button.dataset.accentChoice;

        localStorage.setItem(
          "aci_accent",
          accent
        );

        applyTheme();

      }
    );

  });


themeButton.addEventListener(
  "click",

const suggestionLibrary = [

/* ============================================================
   10-WORD AI SIGNAL
============================================================ */

function limitToTenWords(text) {

  if (!text) {

    return:
      "AI is becoming infrastructure, not just software.";
  }


  const words =
    text
      .trim()
      .split(/\s+/)
      .slice(0, 10);


  let result =
    words.join(" ");


  if (
    !/[.!?]$/.test(result)
  ) {

    result += ".";

  }


  return result;

}


async function loadInsight() {

  signalText.style.opacity =
    ".4";


  try {

    const response =
      await fetch(
        "/api/insight",
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "Insight unavailable"
      );

    }


    const data =
      await response.json();


    signalText.textContent =
      limitToTenWords(
        data.text ||
        data.insight ||
        data.headline
      );


    signalMeta.textContent =
      "Fresh intelligence signal · " +
      new Date().toLocaleTimeString(
        [],
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );


  } catch {

    const fallbackSignals = [

      "AI is becoming infrastructure, not just software.",

      "Cheap intelligence is changing business operations.",

      "AI agents are moving deeper into workflows.",

      "Model choice is becoming an economic decision.",

      "Enterprise AI is moving from pilots to production.",

      "AI infrastructure is becoming a strategic advantage.",

      "The next AI advantage may come from routing.",

      "More AI usage means more economics to manage.",

      "AI capability is becoming increasingly commoditized.",

      "The valuable layer may sit above the models."

    ];


    const random =
      fallbackSignals[
        Math.floor(
          Math.random() *
          fallbackSignals.length
        )
      ];


    signalText.textContent =
      limitToTenWords(random);


    signalMeta.textContent =
      "ACI intelligence signal";

  }


  setTimeout(() => {

    signalText.style.opacity =
      "1";

  }, 100);

}


/* ============================================================
   TEXTAREA
============================================================ */

function autoResize() {

  promptInput.style.height =
    "auto";


  promptInput.style.height =
    Math.min(
      promptInput.scrollHeight,
      190
    ) + "px";

}


promptInput.addEventListener(

);


promptInput.addEventListener(

/* ============================================================
   FILE
============================================================ */

attachButton.addEventListener(

  () => {

    fileInput.click();

  }
);


fileInput.addEventListener(
  "change",
  () => {

    const file =
      fileInput.files?.[0];


    if (!file) {
      return;
    }


    selectedFile =

    attachment.classList.add(

    );

);


removeFile.addEventListener(

  () => {

    fileInput.value =
      "";

    attachment.classList.remove(
      "visible"
    );

    attachmentName.textContent =
      "";

  }
);


/* ============================================================
   FILE READING
============================================================ */

function readFileAsText(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          resolve(
            reader.result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not read the file."
            )
          );

        };


      reader.readAsText(file);

    }
  );

}


function readFileAsBase64(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();


      reader.onload =
        () => {

          const result =
            reader.result || "";


          const comma =
            result.indexOf(",");


          resolve(
            comma >= 0
              ? result.slice(
                  comma + 1
                )
              : result
          );

        };


      reader.onerror =
        () => {

          reject(
            new Error(
              "Could not process the attachment."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* ============================================================
   PREPARE FILE
============================================================ */

async function prepareFileForAI(file) {

  if (!file) {

    return null;

  }


  const MAX_FILE_SIZE =
    2.8 * 1024 * 1024;


  if (
    file.size >
    MAX_FILE_SIZE
  ) {

    throw new Error(
      "For now, attachments must be smaller than 2.8 MB."
    );

  }


  /*
    PDF
  */

  if (
    file.type ===
      "application/pdf" ||
    file.name
      .toLowerCase()
      .endsWith(".pdf")
  ) {

    const base64 =
      await readFileAsBase64(
        file
      );


    return {

      name:
        file.name,

      mimeType:
        "application/pdf",

      base64

    };

  }


  /*
    IMAGE
  */

  if (
    file.type &&
    file.type.startsWith(
      "image/"
    )
  ) {

    const base64 =
      await readFileAsBase64(
        file
      );


    return {

      name:
        file.name,

      mimeType:
        file.type,

      base64

    };

  }


  /*
    TEXT / CODE
  */

  const text =
    await readFileAsText(
      file
    );


  return {

    name:
      file.name,

    mimeType:
      file.type ||
      "text/plain",

    extractedText:
      text

  };

}


/* ============================================================
   BASIC SAFE MARKDOWN
============================================================ */

function escapeHTML(value) {

  return value
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function renderMarkdown(text) {

  let html =
    escapeHTML(
      String(text || "")
    );


  /*
    Bold
  */

  html =
    html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );


  /*
    Italic
  */

  html =
    html.replace(
      /\*(.*?)\*/g,
      "<em>$1</em>"
    );


  /*
    Inline code
  */

  html =
    html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );


  /*
    Bullet points
  */

  const lines =
    html.split("\n");


  let result =
    "";

  let inList =
    false;


  for (
    const line of lines
  ) {

    if (
      /^\s*[-•]\s+/.test(line)
    ) {

      if (!inList) {

        result +=
          "<ul>";

        inList =
          true;

      }


      result +=
        "<li>" +
        line
          .replace(
            /^\s*[-•]\s+/,
            ""
          ) +
        "</li>";

    } else {

      if (inList) {

        result +=
          "</ul>";

        inList =
          false;

      }


      if (
        line.trim()
      ) {

        result +=
          "<p>" +
          line +
          "</p>";

      }

    }

  }


  if (inList) {

    result +=
      "</ul>";

  }


  return result;

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
  role,
  content
) {

  const wrapper =
    document.createElement(
      "div"
    );


  wrapper.className =
    "message " +
    role;


  const inner =
    document.createElement(
      "div"
    );


  inner.className =
    "message-inner";


  const label =
    document.createElement(
      "div"
    );


  label.className =
    "message-label";


  label.textContent =
    role === "user"
      ? "You"
      : "ACI";


  const bubble =
    document.createElement(
      "div"
    );


  bubble.className =
    "bubble";


  if (
    role === "ai"
  ) {

    const markdown =
      document.createElement(
        "div"
      );


    markdown.className =
      "markdown";


    markdown.innerHTML =
      renderMarkdown(
        content
      );


    bubble.appendChild(
      markdown
    );

  } else {

    bubble.textContent =
      content;

  }


  inner.appendChild(
    label
  );

  inner.appendChild(
    bubble
  );

  wrapper.appendChild(
    inner
  );


  messages.appendChild(
    wrapper
  );


  scrollToBottom();


  return bubble;

}

/* ============================================================
   TRACE
============================================================ */

function renderTrace(data) {

  traceGrid.innerHTML =
    "";


  if (!data) {

    trace.classList.remove(
      "visible"
    );

    return;

  }


  const items = [

    [
      "Task",
      data.taskType
    ],

    [
      "Complexity",
      data.complexity + "/5"
    ],

    [
      "Sensitivity",
      data.sensitivity
    ],

    [
      "Quality",
      data.requiredQuality + "%"
    ],

    [
      "Model",
      data.model
    ],

    [
      "Provider",
      data.provider
    ],

    [
      "Tier",
      data.routingTier
    ],

    [
      "Tokens",
      data.totalTokens
    ],

    [
      "Latency",
      data.latencyMs + "ms"
    ],

    [
      "Outcome",
      data.outcome
    ],

    [
      "Fallback",
      data.fallbackUsed
        ? "YES"
        : "NO"
    ]

  ];


  items.forEach(
    ([label, value]) => {

      if (
        value === undefined ||
        value === null
      ) {

        return;

      }


      const pill =
        document.createElement(
          "div"
        );


      pill.className =
        "trace-pill";


      const strong =
        document.createElement(
          "strong"
        );


      strong.textContent =
        label + ": ";


      const span =
        document.createElement(
          "span"
        );


      span.textContent =
        String(value);


      pill.appendChild(
        strong
      );


      pill.appendChild(
        span
      );


      traceGrid.appendChild(
        pill
      );

    }
  );


  trace.classList.add(
    "visible"
  );


  scrollToBottom();

}


/* ============================================================
   SEND
============================================================ */

async function sendPrompt() {

  if (isSending) {
    return;
  }


  const typedPrompt =
    promptInput.value.trim();


  const requestPrompt =
    typedPrompt ||
    (
      selectedFile
        ? "Analyze the attached file and provide the most useful summary or insights."
        : ""
    );


  if (!requestPrompt) {

    promptInput.focus();

    return;

  }


  isSending =
    true;

  sendButton.disabled =
    true;


  suggestions.style.display =
    "none";


  let displayPrompt =
    requestPrompt;


  if (selectedFile) {

    displayPrompt +=
      "\n\n📎 " +
      selectedFile.name;

  }


  addMessage(
    "user",
    displayPrompt
  );


  conversation.push({

    role:
      "user",

    content:
      requestPrompt

  });


  promptInput.value =
    "";

  autoResize();


  let filePayload =
    null;


  try {

    if (selectedFile) {

      filePayload =
        await prepareFileForAI(
          selectedFile
        );

    }

  } catch (error) {

    addError(
      error?.message ||
      "Unable to process the attachment."
    );


    isSending =
      false;

    sendButton.disabled =
      false;

    return;

  }


  const typing =
    addTypingMessage();


  selectedFile =
    null;

  fileInput.value =
    "";

  attachment.classList.remove(
    "visible"
  );

  attachmentName.textContent =
    "";


  trace.classList.remove(
    "visible"
  );


  try {

    const response =
      await fetch(
        "/api/chat",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              prompt:
                requestPrompt,

              file:
                filePayload

            })

        }
      );


    const contentType =
      response.headers.get(
        "content-type"
      ) || "";


    let data;


    if (
      contentType.includes(
        "application/json"
      )
    ) {

      data =
        await response.json();

    } else {

      await response.text();

      throw new Error(
        "ACI server returned an invalid response."
      );

    }


    if (!response.ok) {

      throw new Error(
        data?.error ||
        "AI request failed."
      );

    }


    typing.remove();


    const answer =
      data?.answer ||
      "ACI returned an empty response.";


    addMessage(
      "ai",
      answer
    );


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    renderTrace(
      data?.trace
    );


    saveConversation(
      requestPrompt
    );


  } catch (error) {

    typing.remove();


    addError(
      error?.message ||
      "Something went wrong while contacting ACI."
    );

  } finally {

    isSending =
      false;

    sendButton.disabled =
      false;

    promptInput.focus();

  }

}


/* ============================================================
   SEND BUTTON
============================================================ */

sendButton.addEventListener(
  "click",
  sendPrompt
);


/* ============================================================
   NEW CHAT
============================================================ */

function newChat() {

  conversation =
    [];

  messages.innerHTML =
    "";

  trace.classList.remove(
    "visible"
  );

  traceGrid.innerHTML =
    "";

  promptInput.value =
    "";

  autoResize();

  suggestions.style.display =
    "flex";

  renderSuggestions();

  loadInsight();

  promptInput.focus();

}


newChatButton.addEventListener(
  "click",
  newChat
);


/* ============================================================
   HISTORY
============================================================ */

function getHistory() {

  try {

    return JSON.parse(
      localStorage.getItem(
        "aci_history"
      ) || "[]"
    );

  } catch {

    return [];

  }

}


function saveConversation(title) {

  const cleanTitle =
    title
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 65);


  if (!cleanTitle) {
    return;
  }


  let history =
    getHistory();


  if (
    history.length &&
    history[0].title === cleanTitle
  ) {

    return;

  }


  history.unshift({

    title:
      cleanTitle,

    timestamp:
      Date.now()

  });


  history =
    history.slice(
      0,
      20
    );


  localStorage.setItem(
    "aci_history",
    JSON.stringify(history)
  );


  renderHistory();

}


function renderHistory() {

  const history =
    getHistory();


  historyList.innerHTML =
    "";


  if (!history.length) {

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "history-empty";


    empty.textContent =
      "No conversations yet.";


    historyList.appendChild(
      empty
    );


    return;

  }


  history.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "history-item";


      button.textContent =
        item.title;


      button.addEventListener(
        "click",
        () => {

          promptInput.value =
            item.title;

          autoResize();

          promptInput.focus();

        }
      );


      historyList.appendChild(
        button
      );

    }
  );

}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

  requestAnimationFrame(
    () => {

      chatScroll.scrollTo({

        top:
          chatScroll.scrollHeight,

        behavior:
          "smooth"

      });

    }
  );

}


/* ============================================================
   INITIALIZE
============================================================ */

renderSuggestions();

renderHistory();

loadInsight();

autoResize();

promptInput.focus();


/*
  Refresh editorial signal every 10 minutes.
*/

setInterval(
  loadInsight,
  10 * 60 * 1000
);

</script>
